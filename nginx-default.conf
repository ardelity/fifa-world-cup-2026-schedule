server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # TLS terminates at traefik — emit relative redirects so the
    # trailing-slash redirect doesn't downgrade https to http
    absolute_redirect off;

    # The JSON feeds (esp. bracket-history.json) are large and highly repetitive — compress them
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Site lives under /fifa2026 — send the bare root there
    location = / {
        return 302 /fifa2026/;
    }

    # Live results written by the updater sidecar to the shared volume;
    # falls back to the copy baked into the image until the first fetch lands
    location = /fifa2026/matches.json {
        root /;
        try_files /data/matches.json /usr/share/nginx/html/fifa2026/matches.json =404;
        add_header Cache-Control "no-cache";
    }

    # Ranked best third-placed teams, derived by the updater from the live results
    location = /fifa2026/best-thirds.json {
        root /;
        try_files /data/best-thirds.json =404;
        add_header Cache-Control "no-cache";
    }

    # Round-of-32 bracket projected from the current standings
    location = /fifa2026/bracket.json {
        root /;
        try_files /data/bracket.json =404;
        add_header Cache-Control "no-cache";
    }

    # Game-by-game bracket history (one snapshot per played match) for the scrubber
    location = /fifa2026/bracket-history.json {
        root /;
        try_files /data/bracket-history.json =404;
        add_header Cache-Control "no-cache";
    }

    # Fair-play (disciplinary) points per team, used as the third-place tiebreaker
    location = /fifa2026/fairplay.json {
        root /;
        try_files /data/fairplay.json =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
