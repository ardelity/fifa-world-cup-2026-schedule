    tt: {
      toggle: 'Trea-racet — detaljer',
      cols: ['#', 'Grp', 'Lag', 'S', 'P', 'MS', 'GM', 'Topp 8', 'Garanterad 3:a', 'Hot'],
      yes: 'ja', no: 'nej',
      heldTitle: 'Kan inte falla under tredje plats i sin egen grupp',
      threatsTitle: 'Andra grupper vars trea fortfarande kan sluta på eller över detta lag (≤ 7 ⇒ klar)'
    }
  }
};
let L = I18N[lang] ?? I18N.sv;

// Swedish team/country names (only those that differ from the English source data)
const TEAM_SV = {
  'Algeria': 'Algeriet', 'Australia': 'Australien', 'Austria': 'Österrike', 'Belgium': 'Belgien',
  'Bosnia and Herzegovina': 'Bosnien-Hercegovina', 'Brazil': 'Brasilien', 'Cabo Verde': 'Kap Verde',
  'Canada': 'Kanada', 'Congo DR': 'DR Kongo', 'Croatia': 'Kroatien', 'Czechia': 'Tjeckien',
  "Côte d'Ivoire": 'Elfenbenskusten', 'Egypt': 'Egypten', 'France': 'Frankrike', 'Germany': 'Tyskland',
  'IR Iran': 'Iran', 'Iraq': 'Irak', 'Jordan': 'Jordanien', 'Korea Republic': 'Sydkorea',
  'Mexico': 'Mexiko', 'Morocco': 'Marocko', 'Netherlands': 'Nederländerna', 'New Zealand': 'Nya Zeeland',
  'Norway': 'Norge', 'Saudi Arabia': 'Saudiarabien', 'Scotland': 'Skottland', 'South Africa': 'Sydafrika',
  'Spain': 'Spanien', 'Sweden': 'Sverige', 'Switzerland': 'Schweiz', 'Tunisia': 'Tunisien',
  'Türkiye': 'Turkiet'
};
// FIFA three-letter codes — used in the compact mobile calendar
const TEAM_CODE = {
  'Algeria': 'ALG', 'Argentina': 'ARG', 'Australia': 'AUS', 'Austria': 'AUT', 'Belgium': 'BEL',
  'Bosnia and Herzegovina': 'BIH', 'Brazil': 'BRA', 'Cabo Verde': 'CPV', 'Canada': 'CAN',
  'Colombia': 'COL', 'Congo DR': 'COD', 'Croatia': 'CRO', 'Curaçao': 'CUW', 'Czechia': 'CZE',
  "Côte d'Ivoire": 'CIV', 'Ecuador': 'ECU', 'Egypt': 'EGY', 'England': 'ENG', 'France': 'FRA',
  'Germany': 'GER', 'Ghana': 'GHA', 'Haiti': 'HAI', 'IR Iran': 'IRN', 'Iraq': 'IRQ',
  'Japan': 'JPN', 'Jordan': 'JOR', 'Korea Republic': 'KOR', 'Mexico': 'MEX', 'Morocco': 'MAR',
  'Netherlands': 'NED', 'New Zealand': 'NZL', 'Norway': 'NOR', 'Panama': 'PAN', 'Paraguay': 'PAR',
  'Portugal': 'POR', 'Qatar': 'QAT', 'Saudi Arabia': 'KSA', 'Scotland': 'SCO', 'Senegal': 'SEN',
  'South Africa': 'RSA', 'Spain': 'ESP', 'Sweden': 'SWE', 'Switzerland': 'SUI', 'Tunisia': 'TUN',
  'Türkiye': 'TUR', 'Uruguay': 'URU', 'USA': 'USA', 'Uzbekistan': 'UZB'
};
// Display name in the active language; selection state always keys on the English source name
const disp = name => lang === 'sv' ? (TEAM_SV[name] ?? name) : name;
const dispGroup = g => lang === 'sv' ? g.replace('Group', 'Grupp') : g;
// sv-SE formats weekday/month names in lowercase — capitalize for headings
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// Per-team highlight colors — warm/pastel tones that read well on the dark navy background
const PALETTE = ['#f2a35c', '#e07bea', '#6fd98f', '#f4838f', '#c4a7ff', '#ffd166', '#5ee0c2', '#cde06c'];
const teamColors = new Map(); // team -> color; membership in this map = selected
const isSel = name => teamColors.has(name);
const colorOf = name => teamColors.get(name);
let filterOnly = false;
const selectedVenues = new Set(); // keyed by m.location (no selection = show all)
const selectedCountries = new Set();
// Team filter (when toggled on), country filter and venue filter combine
const matchVisible = m =>
  (!filterOnly || teamColors.size === 0 || isSel(m.homeTeam) || isSel(m.awayTeam))
  && (selectedCountries.size === 0 || selectedCountries.has(m.country))
  && (selectedVenues.size === 0 || selectedVenues.has(m.location));

// Filter selections persist across sessions (same localStorage approach as the language)
function saveFilters() {
  try {
    localStorage.setItem('filters', JSON.stringify({
      teams: [...teamColors],
      only: filterOnly,
      venues: [...selectedVenues],
      countries: [...selectedCountries],
    }));
  } catch {}
}
(function loadFilters() {
  try {
    const f = JSON.parse(localStorage.getItem('filters'));
    if (!f) return;
    for (const [team, color] of f.teams ?? []) teamColors.set(team, color);
    filterOnly = !!f.only;
    for (const v of f.venues ?? []) selectedVenues.add(v);
    for (const c of f.countries ?? []) selectedCountries.add(c);
  } catch {}
})();

function toggleTeam(team) {
  if (isSel(team)) { teamColors.delete(team); return; }
  const used = new Set(teamColors.values());
  teamColors.set(team, PALETTE.find(c => !used.has(c)) ?? PALETTE[teamColors.size % PALETTE.length]);
}

// Team name, colored if selected
const teamSpan = name => isSel(name) ? `<span style="color:${colorOf(name)}">${disp(name)}</span>` : disp(name);

// Flag image for a real country; empty for placeholder slots (1A / Winner of … / TBD)
const flagImg = name => TEAM_CODE[name]
  ? `<img class="flag" src="img/flags/${TEAM_CODE[name].toLowerCase()}.svg" alt="" loading="lazy">`
  : '';

function stageOf(n) {
  if (n <= 72) return null;            // group stage: show the group instead
  if (n <= 88) return L.stages[0];
  if (n <= 96) return L.stages[1];
  if (n <= 100) return L.stages[2];
  if (n <= 102) return L.stages[3];
  if (n === 103) return L.stages[4];
  return L.stages[5];
}

function bcBadge(match) {
  if (!match.broadcaster) return '';
  return match.broadcaster.split('/').map(ch =>
    `<img class="bc-logo" src="img/${ch.toLowerCase()}.svg" alt="${ch}" title="${ch}">`
  ).join('');
}

function prettyTeam(name) {
  let m;
  if ((m = /^1([A-L])$/.exec(name))) return { text: L.groupWinner(m[1]), ph: true };
  if ((m = /^2([A-L])$/.exec(name))) return { text: L.runnerUp(m[1]), ph: true };
  if ((m = /^3([A-L]+)$/.exec(name))) return { text: L.thirdPlace(m[1].split('').join('/')), ph: true };
  if (name === 'To be announced') return { text: L.tbd, ph: true };
  return { text: disp(name), ph: false };
}

// Date + time of a match in the active timezone
function partsFor(iso) {
  const p = new Intl.DateTimeFormat('en-CA', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).formatToParts(new Date(iso));
  const get = t => p.find(x => x.type === t).value;
  return { date: `${get('year')}-${get('month')}-${get('day')}`, time: `${get('hour')}:${get('minute')}` };
}

// Abbreviation like "UTC" / "CEST" (whole tournament is June–July, so one sample suffices)
function tzAbbr() {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: tz, timeZoneName: 'short' })
    .formatToParts(new Date(MATCHES[0].dateUtc));
  return p.find(x => x.type === 'timeZoneName')?.value || tz;
}

const list = document.getElementById('list');
const calendar = document.getElementById('calendar');

function renderList() {
  list.innerHTML = '';
  const fmtDay = new Intl.DateTimeFormat(L.locale, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: tz });
  const abbr = tzAbbr();
  let currentDay = '';

  for (const match of MATCHES) {
    if (!matchVisible(match)) continue;
    const dt = new Date(match.dateUtc);
    const day = cap(fmtDay.format(dt));
    if (day !== currentDay) {
      currentDay = day;
      const h = document.createElement('div');
      h.className = 'day';
      h.textContent = day;
      list.appendChild(h);
    }

    const home = prettyTeam(match.homeTeam);
    const away = prettyTeam(match.awayTeam);
    const played = match.homeScore !== null && match.awayScore !== null;
    const stage = stageOf(match.matchNumber);
    const metaParts = [`${L.match} ${match.matchNumber}`, stage
      ? `<span class="stage-tag">${stage}</span>`
      : `<span class="stage-tag group-link" data-group="${match.group}">${dispGroup(match.group)}</span>`];

    const card = document.createElement('div');
    card.className = 'match' + (played ? ' played' : '')
      + (isSel(match.homeTeam) || isSel(match.awayTeam) ? ' sel' : '');
    card.innerHTML = `
      <div class="time">${partsFor(match.dateUtc).time}<small>${abbr}</small></div>
      <div class="team home${home.ph ? ' placeholder' : ''}${isSel(match.homeTeam) ? ' sel' : ''}">${isSel(match.homeTeam) ? teamSpan(match.homeTeam) : home.text}${flagImg(match.homeTeam)}</div>
      <div class="score${played ? '' : ' vs'}">${played ? match.homeScore + ' – ' + match.awayScore : 'vs'}</div>
      <div class="team away${away.ph ? ' placeholder' : ''}${isSel(match.awayTeam) ? ' sel' : ''}">${flagImg(match.awayTeam)}${isSel(match.awayTeam) ? teamSpan(match.awayTeam) : away.text}</div>
      <div class="meta meta-row"><span>${metaParts.join(' · ')}</span><span class="meta-bc">${bcBadge(match)}</span></div>
      <div class="meta meta-loc">${match.stadium}, ${match.city}, ${disp(match.country)}</div>`;
    list.appendChild(card);
  }
}

function renderCalendar() {
  calendar.innerHTML = '';

  const byDate = new Map(); // 'YYYY-MM-DD' in active tz -> [{match, time}]
  for (const match of MATCHES) {
    if (!matchVisible(match)) continue;
    const { date, time } = partsFor(match.dateUtc);
    if (!byDate.has(date)) byDate.set(date, []);
    byDate.get(date).push({ match, time });
  }

  const fmtMonth = new Intl.DateTimeFormat(L.locale, { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const months = [...new Set([...byDate.keys()].map(k => k.slice(0, 7)))].sort();

  const navBar = document.createElement('div');
  navBar.id = 'cal-nav';
  calendar.appendChild(navBar);
  const todayKey = partsFor(new Date().toISOString()).date;
  let todayCell = null;

  for (const ym of months) {
    const [year, month] = ym.split('-').map(Number);
    const first = new Date(Date.UTC(year, month - 1, 1));
    const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();

    const title = document.createElement('div');
    title.className = 'month-title';
    title.textContent = cap(fmtMonth.format(first));
    calendar.appendChild(title);

    const monthBtn = document.createElement('button');
    monthBtn.textContent = title.textContent;
    monthBtn.addEventListener('click', () => title.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    navBar.appendChild(monthBtn);

    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    for (const wd of L.weekdays) {
      const h = document.createElement('div');
      h.className = 'cal-weekday';
      h.textContent = wd;
      grid.appendChild(h);
    }

    const leadingBlanks = (first.getUTCDay() + 6) % 7; // Monday-first offset
    for (let i = 0; i < leadingBlanks; i++) {
      const blank = document.createElement('div');
      blank.className = 'cal-cell empty';
      grid.appendChild(blank);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const key = `${ym}-${String(day).padStart(2, '0')}`;
      const dayMatches = byDate.get(key) || [];
      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (dayMatches.length ? ' has-matches' : '');
      if (key === todayKey) { cell.classList.add('today'); todayCell = cell; }
      const num = document.createElement('div');
      num.className = 'cal-daynum';
      num.textContent = day;
      cell.appendChild(num);

      // Compact code for the mobile grid: FIFA code, or the raw placeholder (1A, 3ABC, TBD)
      const shortName = n => TEAM_CODE[n] ?? (n === 'To be announced' ? L.tbd : n);
      const shortSpan = n => isSel(n) ? `<span style="color:${colorOf(n)}">${shortName(n)}</span>` : shortName(n);

      for (const { match, time } of dayMatches) {
        const home = prettyTeam(match.homeTeam);
        const away = prettyTeam(match.awayTeam);
        const played = match.homeScore !== null && match.awayScore !== null;
        const mid = played ? `<span class="cm-score">${match.homeScore}–${match.awayScore}</span>` : '–';
        const entry = document.createElement('div');
        entry.className = 'cal-match'
          + (match.broadcaster ? (match.broadcaster.startsWith('SVT') ? ' bc-svt' : ' bc-tv4') : '')
          + (isSel(match.homeTeam) || isSel(match.awayTeam) ? ' sel' : '');
        entry.title = `${home.text} vs ${away.text} · ${match.stadium}, ${match.city}, ${disp(match.country)} · ${L.match} ${match.matchNumber}`
          + (match.broadcaster ? ` · ${match.broadcaster}` : '');
        entry.innerHTML = `<span class="cm-time">${time}</span>${bcBadge(match)}
          <span class="cm-teams cm-full${home.ph || away.ph ? ' placeholder' : ''}">${isSel(match.homeTeam) ? teamSpan(match.homeTeam) : home.text} ${mid} ${isSel(match.awayTeam) ? teamSpan(match.awayTeam) : away.text}</span>
          <span class="cm-teams cm-short${home.ph || away.ph ? ' placeholder' : ''}">${shortSpan(match.homeTeam)}<br>${shortSpan(match.awayTeam)}${played ? `<br><span class="cm-score">${match.homeScore}–${match.awayScore}</span>` : ''}</span>`;
        cell.appendChild(entry);
      }
      grid.appendChild(cell);
    }
    calendar.appendChild(grid);
  }

  if (todayCell) {
    const btn = document.createElement('button');
    btn.textContent = L.today;
    btn.addEventListener('click', () => todayCell.scrollIntoView({ behavior: 'smooth', block: 'center' }));
    navBar.appendChild(btn);
  }
}

// ---- Groups sidebar ----
function computeGroups(matches = MATCHES) {
  const groups = new Map(); // 'Group A' -> Map(team -> stats)
  for (const m of matches) {
    if (m.matchNumber > 72) continue;
    if (!groups.has(m.group)) groups.set(m.group, new Map());
    const g = groups.get(m.group);
    for (const t of [m.homeTeam, m.awayTeam]) {
      if (!g.has(t)) g.set(t, { team: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 });
    }
    if (m.homeScore === null || m.awayScore === null) continue;
    const h = g.get(m.homeTeam), a = g.get(m.awayTeam);
    h.p++; a.p++;
    h.gf += m.homeScore; h.ga += m.awayScore;
    a.gf += m.awayScore; a.ga += m.homeScore;
    if (m.homeScore > m.awayScore) { h.w++; a.l++; h.pts += 3; }
    else if (m.homeScore < m.awayScore) { a.w++; h.l++; a.pts += 3; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  }
  // FIFA 2026 group ranking (new this tournament): points, then HEAD-TO-HEAD among the teams
  // still level (mini-table points → GD → goals from the matches between them only), then overall
  // GD → overall goals → fair play → FIFA ranking. Head-to-head now comes BEFORE overall goal
  // difference — the reverse of every pre-2026 World Cup. Between thirds of different groups (who
  // never met) the overall criteria decide; that's handled in bestThirds().
  const fpOf = n => (FAIRPLAY && FAIRPLAY[n]) || 0;
  const rkOf = n => FIFA_RANK[n] ?? 999;
  const rankGroup = (rows, groupName) => {
    // Mini-table among `subset` from the played matches between those teams only.
    const mini = subset => {
      const names = new Set(subset.map(t => t.team));
      const mt = new Map(subset.map(t => [t.team, { pts: 0, gd: 0, gf: 0 }]));
      for (const m of matches) {
        if (m.matchNumber > 72 || m.group !== groupName || m.homeScore === null || m.awayScore === null) continue;
        if (!names.has(m.homeTeam) || !names.has(m.awayTeam)) continue;
        const h = mt.get(m.homeTeam), a = mt.get(m.awayTeam);
        h.gd += m.homeScore - m.awayScore; a.gd += m.awayScore - m.homeScore;
        h.gf += m.homeScore; a.gf += m.awayScore;
        if (m.homeScore > m.awayScore) h.pts += 3; else if (m.homeScore < m.awayScore) a.pts += 3; else { h.pts++; a.pts++; }
      }
      return mt;
    };
    const overall = (a, b) => (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf || fpOf(a.team) - fpOf(b.team) || rkOf(a.team) - rkOf(b.team) || a.team.localeCompare(b.team);
    // Order a set of teams all level on points, recursively re-applying head-to-head to any
    // subset that the wider mini-table leaves still tied (per the FIFA criteria).
    const resolveTie = tied => {
      if (tied.length <= 1) return tied.slice();
      const mt = mini(tied);
      const key = t => { const x = mt.get(t.team); return `${x.pts}|${x.gd}|${x.gf}`; };
      const buckets = [...new Set(tied.map(key))]
        .map(k => ({ teams: tied.filter(t => key(t) === k), x: mt.get(tied.find(t => key(t) === k).team) }))
        .sort((A, B) => B.x.pts - A.x.pts || B.x.gd - A.x.gd || B.x.gf - A.x.gf);
      const out = [];
      for (const b of buckets) {
        if (b.teams.length === 1) out.push(b.teams[0]);
        else if (b.teams.length === tied.length) out.push(...b.teams.slice().sort(overall)); // head-to-head didn't separate them
        else out.push(...resolveTie(b.teams));                                              // smaller tie — re-run head-to-head
      }
      return out;
    };
    const out = [];
    for (const p of [...new Set(rows.map(r => r.pts))].sort((a, b) => b - a)) out.push(...resolveTie(rows.filter(r => r.pts === p)));
    return out;
  };
  return [...groups.entries()].sort((x, y) => x[0].localeCompare(y[0]))
    .map(([name, teams]) => ({ name, rows: rankGroup([...teams.values()], name) }));
}

// The 12 third-placed teams ranked best-first (points, goal difference, goals for, group);
// the top 8 fill the round-of-32 third-place slots. Mirrors the updater's bestThirds().
// `secured` marks a third that has CLINCHED a top-8 spot: in the worst case (it wins no
// more, every rival wins out) it can neither be pushed below 3rd in its group nor finish
// behind more than 7 other groups' thirds. The bound is points-first, but once the relevant
// teams have played all their games it also applies the GD/goals/fair-play/ranking tiebreaks,
// so a third level on points with a rival is ruled in or out exactly instead of always being
// treated as beatable. Still sound (never a false clinch): a tiebreak only counts when both
// teams are finished, since otherwise GD/goals could still be run up to overhaul it.
function bestThirds(matches = MATCHES, qualifyGroups = null) {
  const groups = computeGroups(matches);
  const rem = r => 3 - r.p;                              // four-team groups: three games each
  const maxPts = r => r.pts + 3 * rem(r);               // most points a team can still reach
  const thirdCeil = rows => rows.map(maxPts).sort((a, b) => b - a)[2]; // ceiling for a group's eventual 3rd
  const fpOf = name => (FAIRPLAY && FAIRPLAY[name]) || 0; // fair-play points (fewer is better); 0 if unknown
  const rkOf = name => FIFA_RANK[name] ?? 999;            // FIFA ranking (lower is better)
  const thirds = [];
  for (const grp of groups) {
    const r = grp.rows[2];
    if (r) thirds.push({ group: grp.name.replace(/^Group\s*/i, ''), team: r.team, pts: r.pts, gd: r.gf - r.ga, gf: r.gf, fp: fpOf(r.team), rk: rkOf(r.team), played: r.p, _rows: grp.rows });
  }
  // FIFA cross-group order: points, GD, goals scored, then FAIR PLAY, then FIFA RANKING, then group.
  thirds.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.fp - b.fp || a.rk - b.rk || a.group.localeCompare(b.group));
  // Tag the criterion that actually decided a third's order when it's level on pts/GD/GF with a
  // neighbour: 'fp' if fair play separated them, else 'rank' (FIFA ranking).
  for (let i = 0; i < thirds.length; i++) {
    const t = thirds[i], level = o => o && o.pts === t.pts && o.gd === t.gd && o.gf === t.gf;
    const sep = o => t.fp !== o.fp ? 'fp' : 'rank';
    if (level(thirds[i - 1])) t.tb = sep(thirds[i - 1]);
    else if (level(thirds[i + 1])) t.tb = sep(thirds[i + 1]);
  }
  // Head-to-head: has A already beaten B in their group match? (round-robin — they meet once.)
  const beat = (A, B, gl) => {
    for (const m of matches) {
      if (m.matchNumber > 72 || m.group !== 'Group ' + gl || m.homeScore === null || m.awayScore === null) continue;
      if (m.homeTeam === A && m.awayTeam === B) return m.homeScore > m.awayScore;
      if (m.homeTeam === B && m.awayTeam === A) return m.awayScore > m.homeScore;
    }
    return false;
  };
  return thirds.map((t, i) => {
    const tDone = t.played === 3;
    // Stays 3rd-or-better: a finished group fixes t as its third; otherwise at most two
    // group-mates can still reach its points (level-on-points group-mates are settled by the
    // group order, which already placed t third).
    const groupDone = t._rows.every(r => rem(r) === 0);
    // Stays 3rd-or-better (head-to-head aware): a finished group fixes t as its third. Otherwise
    // count group-mates that could still finish above t in the worst case — a rival that can only
    // TIE t on points (not exceed) is excluded when t already beat it head-to-head AND that tie can
    // only be two-way (no other team can also land on that points total), since head-to-head then
    // keeps t ahead. At most two rivals possibly above ⇒ t is guaranteed at least 3rd.
    const canBeAt = (x, lvl) => x.pts <= lvl && maxPts(x) >= lvl;
    const above = t._rows.filter(r => {
      if (r.team === t.team) return false;
      const rMax = maxPts(r);
      if (rMax < t.pts) return false;                       // can't reach t's floor
      if (rMax === t.pts && beat(t.team, r.team, t.group)
          && t._rows.every(x => x.team === t.team || x.team === r.team || !canBeAt(x, t.pts))) return false;
      return true;
    }).length;
    const heldInGroup = groupDone || above <= 2;
    // Other groups whose eventual 3rd can still finish at or above t. A group only counts when
    // its 3rd can outscore t on points, or — when both are finished — tie on points and win the
    // GD/goals/fair-play/ranking tiebreak (same cross-group order as the sort above).
    const passable = groups.filter(g => {
      const gl = g.name.replace(/^Group\s*/i, '');
      if (gl === t.group) return false;
      const pc = thirdCeil(g.rows);
      if (pc !== t.pts) return pc > t.pts;
      const gDone = g.rows.every(r => rem(r) === 0);
      if (!(tDone && gDone)) return true;                 // GD/goals could still be run up — assume beatable
      const third = g.rows[2];
      if (!third) return true;
      const cmp = (t.gd - (third.gf - third.ga)) || (t.gf - third.gf)
        || (fpOf(third.team) - t.fp) || (rkOf(third.team) - t.rk) || gl.localeCompare(t.group);
      return cmp < 0;                                     // that 3rd finishes above t → still a threat
    }).length;
    // In what-if mode the qualifying eight are the chosen combination's groups; "secured" is moot.
    const qualifies = qualifyGroups ? qualifyGroups.has(t.group) : i < 8;
    const secured = qualifyGroups ? false : (heldInGroup && passable <= 7);
    return { rank: i + 1, qualifies, secured, held: heldInGroup, threats: passable, played: t.played, tb: t.tb || null, fp: t.fp, rk: t.rk, group: t.group, team: t.team, pts: t.pts, gd: t.gd, gf: t.gf };
  });
}

function renderTeamsBar() {
  const bar = document.getElementById('teams-bar');
  bar.innerHTML = '';

  const countryPanel = document.createElement('div');
  countryPanel.className = 'group-card teams-panel';
  const cTitle = document.createElement('h3');
  cTitle.textContent = L.hostCountry;
  cTitle.title = L.hostCountryTip;
  countryPanel.appendChild(cTitle);
  const countries = [...new Set(allVenues().map(v => v.country))].sort((a, b) => disp(a).localeCompare(disp(b), L.locale));
  for (const country of countries) {
    const chip = document.createElement('span');
    chip.className = 'team-chip venue-chip' + (selectedCountries.has(country) ? ' sel' : '');
    chip.textContent = disp(country);
    chip.addEventListener('click', () => {
      if (selectedCountries.has(country)) selectedCountries.delete(country);
      else selectedCountries.add(country);
      renderAll();
    });
    countryPanel.appendChild(chip);
  }
  bar.appendChild(countryPanel);

  const venuePanel = document.createElement('div');
  venuePanel.className = 'group-card teams-panel';
  const vTitle = document.createElement('h3');
  vTitle.textContent = L.venuesHeading;
  vTitle.title = L.venuesTip;
  venuePanel.appendChild(vTitle);
  for (const venue of allVenues()) {
    const chip = document.createElement('span');
    chip.className = 'team-chip venue-chip' + (selectedVenues.has(venue.location) ? ' sel' : '');
    chip.textContent = venue.city;
    chip.title = venue.stadium;
    chip.addEventListener('click', () => {
      if (selectedVenues.has(venue.location)) selectedVenues.delete(venue.location);
      else selectedVenues.add(venue.location);
      renderAll();
    });
    venuePanel.appendChild(chip);
  }
  bar.appendChild(venuePanel);

  const panel = document.createElement('div');
  panel.className = 'group-card teams-panel';
  const title = document.createElement('h3');
  title.textContent = L.teamsHeading;
  title.title = L.teamsTip;
  panel.appendChild(title);

  const toggle = document.createElement('span');
  toggle.className = 'team-chip filter-toggle' + (filterOnly ? ' on' : '');
  toggle.textContent = (filterOnly ? '✓ ' : '') + L.onlySelected;
  toggle.title = L.onlySelectedTip;
  toggle.addEventListener('click', () => { filterOnly = !filterOnly; renderAll(); });
  panel.appendChild(toggle);
  const allTeams = [...new Set(MATCHES.filter(m => m.matchNumber <= 72).flatMap(m => [m.homeTeam, m.awayTeam]))]
    .sort((a, b) => disp(a).localeCompare(disp(b), L.locale));
  for (const team of allTeams) {
    const chip = document.createElement('span');
    chip.className = 'team-chip' + (isSel(team) ? ' sel' : '');
    chip.textContent = disp(team);
    if (isSel(team)) {
      chip.style.color = colorOf(team);
      chip.style.borderColor = colorOf(team);
    }
    chip.addEventListener('click', () => {
      toggleTeam(team);
      renderAll();
    });
    panel.appendChild(chip);
  }
  bar.appendChild(panel);
}

function allVenues() {
  const seen = new Map();
  for (const m of MATCHES) {
    if (!seen.has(m.location)) seen.set(m.location, { location: m.location, stadium: m.stadium, city: m.city, country: m.country });
  }
  return [...seen.values()].sort((a, b) => a.city.localeCompare(b.city));
}

function renderVenues() {
  const container = document.getElementById('venues');
  container.innerHTML = '';
  const fmtDate = new Intl.DateTimeFormat(L.locale, { weekday: 'short', day: 'numeric', month: 'short', timeZone: tz });

  for (const venue of allVenues()) {
    const visibleMatches = MATCHES.filter(m => m.location === venue.location && matchVisible(m));
    if (!visibleMatches.length) continue;

    const matchRows = visibleMatches.map(m => {
      const played = m.homeScore !== null && m.awayScore !== null;
      const home = prettyTeam(m.homeTeam), away = prettyTeam(m.awayTeam);
      const knockout = stageOf(m.matchNumber);
      return `<div class="gm${isSel(m.homeTeam) || isSel(m.awayTeam) ? ' sel' : ''}">
        <span class="gm-date">${fmtDate.format(new Date(m.dateUtc))} ${partsFor(m.dateUtc).time}</span>
        <span class="gm-teams${home.ph || away.ph ? ' placeholder' : ''}">${home.ph ? home.text : teamSpan(m.homeTeam)} – ${away.ph ? away.text : teamSpan(m.awayTeam)}</span>
        <span class="gm-res${played ? '' : ' vs'}">${played ? m.homeScore + '–' + m.awayScore : 'vs'}</span>
        <span class="gm-bc">${bcBadge(m)}</span>
        <span class="gm-loc">${knockout ? `<span class="stage-tag">${knockout}</span>` : dispGroup(m.group)}</span>
      </div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'group-card';
    card.innerHTML = `<h3>${venue.stadium}</h3>
      <div class="venue-city">${venue.city}, ${disp(venue.country)}</div>
      <div class="gm-list">${matchRows}</div>`;
    container.appendChild(card);
  }
}

function renderGroups() {
  const container = document.getElementById('groups');
  container.innerHTML = '';
  const fmtDate = new Intl.DateTimeFormat(L.locale, { weekday: 'short', day: 'numeric', month: 'short', timeZone: tz });

  for (const group of computeGroups()) {
    const card = document.createElement('div');
    card.className = 'group-card';
    card.dataset.group = group.name;
    const rows = group.rows.map(r => {
      const gd = r.gf - r.ga;
      return `<tr${isSel(r.team) ? ' class="sel"' : ''}>
        <td class="t" title="${disp(r.team)}">${flagImg(r.team)}${teamSpan(r.team)}</td>
        <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
        <td>${gd > 0 ? '+' + gd : gd}</td><td class="pts">${r.pts}</td>
      </tr>`;
    }).join('');

    const visibleMatches = MATCHES.filter(m => m.group === group.name && matchVisible(m));
    if (!visibleMatches.length) continue;
    const matchRows = visibleMatches.map(m => {
      const played = m.homeScore !== null && m.awayScore !== null;
      return `<div class="gm${isSel(m.homeTeam) || isSel(m.awayTeam) ? ' sel' : ''}">
        <span class="gm-date">${fmtDate.format(new Date(m.dateUtc))} ${partsFor(m.dateUtc).time}</span>
        <span class="gm-teams">${teamSpan(m.homeTeam)} – ${teamSpan(m.awayTeam)}</span>
        <span class="gm-res${played ? '' : ' vs'}">${played ? m.homeScore + '–' + m.awayScore : 'vs'}</span>
        <span class="gm-bc">${bcBadge(m)}</span>
        <span class="gm-loc">${m.stadium}, ${m.city}, ${disp(m.country)}</span>
      </div>`;
    }).join('');

    card.innerHTML = `<h3>${dispGroup(group.name)}</h3>
      <table>
        <colgroup><col style="width:43%"><col><col><col><col><col style="width:13%"><col></colgroup>
        <thead><tr><th class="t">${L.thTeam}</th>${L.th.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="gm-list">${matchRows}</div>`;
    container.appendChild(card);
  }
}

// ---- Bracket (knockout tree) view ----
// Columns by FIFA match number, top-to-bottom within each column. Left side flows
// right (R32→R16→QF), right side flows left; the semifinals, final and third-place
// play-off form the centre cluster. Matches the published bracket topology.
const BJ_LEFT = [
  [74, 77, 73, 75, 83, 84, 81, 82], // Round of 32
  [89, 90, 93, 94],                 // Round of 16
  [97, 98],                         // Quarter-final
];
const BJ_RIGHT = [
  [99, 100],                        // Quarter-final
  [91, 92, 95, 96],                 // Round of 16
  [76, 78, 79, 80, 86, 88, 85, 87], // Round of 32
];

// A slot string that is a placeholder, not a real team (1A / 2C / 3ABCDF / W74 / RU101 / L101 / TBA)
const bjPlaceholder = s => !s || /^[123][A-L]+$/.test(s) || /^(W|L|RU)\d+$/.test(s) || s === 'To be announced';

function renderBracket() {
  const el = document.getElementById('bracket');
  // Default to the live BRACKET; if a game-by-game history is loaded, show the chosen
  // snapshot (or the latest) and reconstruct the matches "as of" that game so scores,
  // standings and the thirds panel all reflect that point in the tournament.
  let bracketData = BRACKET, viewMatches = MATCHES, scrub = null;
  const snaps = BRACKET_HISTORY && Array.isArray(BRACKET_HISTORY.snapshots) ? BRACKET_HISTORY.snapshots : null;
  if (snaps && snaps.length) {
    let idx = bracketViewGame === null ? snaps.length - 1 : snaps.findIndex(s => s.game === bracketViewGame);
    if (idx < 0) idx = snaps.length - 1;
    const snap = snaps[idx];
    bracketData = { combination: snap.combination, bracket: snap.bracket };
    // Reconstruct results "as of" this game using the same chronological order as the updater.
    const chrono = [...MATCHES].sort((a, b) => a.dateUtc.localeCompare(b.dateUtc) || a.matchNumber - b.matchNumber);
    const cut = chrono.findIndex(m => m.matchNumber === snap.game);
    const seen = new Set(chrono.slice(0, cut + 1).map(m => m.matchNumber));
    viewMatches = MATCHES.map(m => seen.has(m.matchNumber) ? m : { ...m, homeScore: null, awayScore: null });
    scrub = { game: snap.game, seq: snap.seq ?? idx + 1, atEarliest: idx === 0, atLatest: idx === snaps.length - 1 };
  }
  // "Locked" groups: their third has clinched a top-8 spot (same test as the panel's green),
  // so they appear in every still-possible combination. Only combos keeping all of them remain.
  const lockedGroups = ALLOCATIONS ? bestThirds(viewMatches).filter(t => t.secured).map(t => t.group).sort() : [];
  bjLocked = lockedGroups;
  // Required groups = auto-locked (clinched) + user-pinned. Only combos keeping all of them remain.
  const requiredGroups = [...new Set([...lockedGroups, ...pinnedGroups])];
  if (whatIfCombo && requiredGroups.some(g => !whatIfCombo.includes(g))) whatIfCombo = null; // drop a now-impossible pick

  // What-if: re-project the round-of-32 third-place slots using a chosen combination's groups
  // (each third slot gets the 3rd-placed team of the group the Annex C table assigns it).
  const actualCombo = bracketData && bracketData.combination;
  const wif = whatIfCombo && ALLOCATIONS && ALLOCATIONS[whatIfCombo] ? whatIfCombo : null;
  if (wif && bracketData && Array.isArray(bracketData.bracket)) {
    const alloc = ALLOCATIONS[wif];
    const thirdOf = {};
    for (const grp of computeGroups(viewMatches)) thirdOf[grp.name.replace(/^Group\s*/i, '')] = grp.rows[2] && grp.rows[2].team;
    const isThird = s => s && (s.position === 3 || /^3[A-L]/.test(s.slot || ''));
    bracketData = { ...bracketData, combination: wif, bracket: bracketData.bracket.map(b => {
      const g = alloc[b.matchNumber];
      if (!g) return b;
      const fix = s => isThird(s) ? { ...s, position: 3, group: g, team: thirdOf[g] || null, slot: '3' + g, resolved: false } : s;
      return { ...b, home: fix(b.home), away: fix(b.away) };
    }) };
  }
  if (!bracketData || !Array.isArray(bracketData.bracket)) {
    el.innerHTML = `<p class="bj-empty">${L.bracketEmpty}</p>`;
    return;
  }
  const byBracket = new Map(bracketData.bracket.map(b => [b.matchNumber, b]));
  const byMatch = new Map(viewMatches.map(m => [m.matchNumber, m]));
  const dateFmt = new Intl.DateTimeFormat(L.locale, { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: tz });

  // Groups whose every match has been played → final positions are settled.
  const completed = new Set(); const groupIds = new Set();
  { const byG = new Map();
    for (const mm of viewMatches) {
      if (!mm.group) continue;
      const g = mm.group.replace(/^Group\s*/i, '');
      groupIds.add(g);
      (byG.get(g) ?? byG.set(g, []).get(g)).push(mm);
    }
    for (const [g, ms] of byG) if (ms.every(x => x.homeScore !== null && x.awayScore !== null)) completed.add(g);
  }
  const allGroupsDone = groupIds.size > 0 && completed.size === groupIds.size;

  // A slot is "decided" (not just the current projection) once its group is finished
  // (1st/2nd), once every group is finished so the third-place allocation is fixed (3rd),
  // once the feed has officially placed the team, or once the match has been played.
  const isDecided = (resolved, played) => {
    if (played) return true;
    if (!resolved || !resolved.team) return false;
    if (resolved.resolved) return true;
    if (resolved.position === 1 || resolved.position === 2) return completed.has(resolved.group);
    if (resolved.position === 3) return allGroupsDone;
    return false;
  };

  // team -> seeding code (1E / 2C / 3A), from the current group standings — used to label
  // feed-resolved slots that carry no position/group of their own (e.g. the host nations).
  const seedOf = new Map();
  for (const grp of computeGroups(viewMatches)) {
    const letter = grp.name.replace(/^Group\s*/i, '');
    grp.rows.forEach((r, i) => { if (i < 3) seedOf.set(r.team, (i + 1) + letter); });
  }
  // Round-of-32 seeding code for one side: the slot's own position+group, else the team's
  // current standing. (1st/2nd/3rd of a group, e.g. winner of E -> 1E, third of A -> 3A.)
  const seedCode = (resolved, team) => {
    if (resolved && [1, 2, 3].includes(resolved.position) && resolved.group) return resolved.position + resolved.group;
    if (team && seedOf.has(team)) return seedOf.get(team);
    return '';
  };

  // Resolve one side of a tie to { html, real, ph } — a real team gets its flag + code,
  // an unresolved slot gets the compact placeholder code (1A, 3ABCDF, W74, RU101).
  const side = (resolved, playedName, played, expand) => {
    const team = (played && playedName) || (resolved && resolved.team) || null;
    if (team && !bjPlaceholder(team)) {
      const code = TEAM_CODE[team] || disp(team);
      const flag = TEAM_CODE[team] ? `<img class="bj-flag" src="img/flags/${TEAM_CODE[team].toLowerCase()}.svg" alt="" loading="lazy">` : '<span class="bj-flag"></span>';
      return { flag, html: code, real: team, ph: false, title: disp(team) };
    }
    let code = L.tbd;
    if (resolved) {
      if (resolved.slot && !/to be announced/i.test(resolved.slot)) code = resolved.slot;
      else if (resolved.sourceType === 'winner') {
        // Round of 16: until the round-of-32 leg is played, show the two countries in it
        // (only when expanded — i.e. the mobile list; the desktop tree keeps the Wxx code)
        const leg = byBracket.get(resolved.sourceMatch);
        const lm = byMatch.get(resolved.sourceMatch);
        const legPlayed = lm && lm.homeScore !== null && lm.awayScore !== null;
        const t1 = leg && leg.home && leg.home.team, t2 = leg && leg.away && leg.away.team;
        if (expand && resolved.sourceMatch >= 73 && resolved.sourceMatch <= 88 && t1 && t2 && !legPlayed) {
          const mini = t => `${TEAM_CODE[t] ? `<img class="bj-flag-sm" src="img/flags/${TEAM_CODE[t].toLowerCase()}.svg" alt="">` : ''}${TEAM_CODE[t] || disp(t)}`;
          return { flag: '', html: `${mini(t1)}<span class="bj-vs">/</span>${mini(t2)}`, real: null, ph: true, title: `${disp(t1)} / ${disp(t2)}` };
        }
        code = 'W' + resolved.sourceMatch;
      }
      else if (resolved.sourceType === 'loser') code = 'RU' + resolved.sourceMatch;
    }
    return { flag: '<span class="bj-flag"></span>', html: code, real: null, ph: true, title: '' };
  };

  // One match card. numPos places the "Mxx" label: 'l' left, 'r' right, 'b' below.
  // expand=true (mobile list) shows the round-of-32 matchup for undecided round-of-16 slots.
  const card = (n, numPos, expand) => {
    const b = byBracket.get(n), m = byMatch.get(n);
    if (!b && !m) return '';
    const played = m && m.homeScore !== null && m.awayScore !== null;
    const home = side(b && b.home, m && m.homeTeam, played, expand);
    const away = side(b && b.away, m && m.awayTeam, played, expand);
    const dt = (b && b.dateUtc) || (m && m.dateUtc);
    const hWin = played && m.homeScore > m.awayScore;
    const aWin = played && m.awayScore > m.homeScore;
    const stadium = (b && b.stadium) || (m && m.stadium);
    const city = (b && b.city) || (m && m.city);
    const country = (b && b.country) || (m && m.country);
    const cflag = country && TEAM_CODE[country]
      ? `<img class="bj-cflag" src="img/flags/${TEAM_CODE[country].toLowerCase()}.svg" alt="${disp(country)}" title="${disp(country)}">`
      : '';
    const venue = stadium
      ? `<div class="bj-venue">${cflag}<span class="bj-venue-text" title="${stadium}, ${city}, ${disp(country)}"><span>${stadium}</span><span>${city}</span></span></div>`
      : '';
    // Show the group+position seed code in the round of 32 (matches 73–88) for known teams;
    // unresolved slots already render the code as their name, so don't double it up.
    const r32 = n <= 88;
    const hSeed = r32 && !home.ph ? seedCode(b && b.home, home.real) : '';
    const aSeed = r32 && !away.ph ? seedCode(b && b.away, away.real) : '';
    const row = (s, score, win, decided, seed) => `<div class="bj-row${win ? ' bj-win' : ''}${decided ? ' bj-decided' : ''}">${s.flag}` +
      `<span class="bj-name${s.ph ? ' placeholder' : ''}"${s.title ? ` title="${s.title}"` : ''}>${s.html}</span>` +
      (seed ? `<span class="bj-seed-code">${seed}</span>` : '') +
      `<span class="bj-score">${score}</span></div>`;
    return `<div class="bj-card num-${numPos}">
      <div class="bj-when"><span>${dt ? dateFmt.format(new Date(dt)) : ''}</span><span>${dt ? partsFor(dt).time : ''}</span></div>
      <div class="bj-match">
        ${row(home, played ? m.homeScore : '', hWin, isDecided(b && b.home, played), hSeed)}
        ${row(away, played ? m.awayScore : '', aWin, isDecided(b && b.away, played), aSeed)}
      </div>
      ${venue}
      <span class="bj-num">M${n}</span>
    </div>`;
  };

  const column = (nums, head, numPos) => `<div class="bj-col">
    <div class="bj-col-head">${head}</div>
    <div class="bj-seeds">${nums.map(n => `<div class="bj-seed">${card(n, numPos)}</div>`).join('')}</div>
  </div>`;

  const leftHeads = [L.stages[0], L.stages[1], L.stages[2]];
  const rightHeads = [L.stages[2], L.stages[1], L.stages[0]];
  const leftCols = BJ_LEFT.map((nums, i) => column(nums, leftHeads[i], 'l')).join('');
  const rightCols = BJ_RIGHT.map((nums, i) => column(nums, rightHeads[i], 'r')).join('');

  const centre = `<div class="bj-center">
    <div class="bj-final">
      <div class="bj-round-head">${L.stages[5]}</div>
      ${card(104, 'b')}
    </div>
    <div class="bj-sf-row">
      <div class="bj-sf bj-sf-l"><div class="bj-round-head">${L.stages[3]}</div>${card(101, 'l')}</div>
      <div class="bj-sf bj-sf-r"><div class="bj-round-head">${L.stages[3]}</div>${card(102, 'r')}</div>
    </div>
    <div class="bj-third">
      <div class="bj-round-head">${L.stages[4]}</div>
      ${card(103, 'b')}
    </div>
  </div>`;

  // Best third-placed teams — shown above the tree, but only while the group stage is still
  // deciding teams. Once every team is set, the bracket itself shows the thirds, so hide it.
  let thirdsPanel = '';
  if (!allGroupsDone) {
    // In what-if mode, "matched" = this third is both in the chosen combination (qualifies) and in
    // the actual current top 8 (rank <= 8) — i.e. it would go through either way.
    const thirdItem = t => {
      const top8 = wif && t.rank <= 8;                  // actual current top 8 (panel is sorted by real rank)
      const matched = top8 && t.qualifies;              // in the actual top 8 AND the chosen combination
      return `<div class="bj-th-item${t.qualifies ? ' q' : ''}${t.secured ? ' s' : ''}${top8 ? ' t8' : ''}${matched ? ' match' : ''}${pinnedGroups.has(t.group) ? ' pinned' : ''}" data-group="${t.group}" title="${L.pinHint}">
      <span class="bj-th-rank">${t.rank}</span>
      ${TEAM_CODE[t.team] ? `<img class="bj-cflag" src="img/flags/${TEAM_CODE[t.team].toLowerCase()}.svg" alt="">` : '<span class="bj-cflag"></span>'}
      <span class="bj-th-team">${disp(t.team)}</span>
      ${matched ? `<span class="bj-th-match" title="${L.matchTitle}">✓</span>` : ''}
      ${t.tb === 'fp' ? `<span class="bj-th-fp" title="${L.fpTitle}: ${t.fp}">${L.fpTag}</span>`
        : t.tb === 'rank' ? `<span class="bj-th-fp" title="${L.frTitle}: ${t.rk}">${L.frTag}</span>` : ''}
      <span class="bj-th-grp">${dispGroup('Group ' + t.group)}</span>
      <span class="bj-th-gd">${t.gd > 0 ? '+' + t.gd : t.gd < 0 ? t.gd : '±0'}</span>
      <span class="bj-th-pts">${t.pts}&nbsp;${L.th[5]}</span>
    </div>`;
    };
    const thirds = bestThirds(viewMatches, wif ? new Set(wif.split('')) : null);
    const fpNotes = [];
    if (wif) fpNotes.push(L.whatIfLegend);
    if (thirds.some(t => t.tb === 'fp')) fpNotes.push(L.fpNote);
    if (thirds.some(t => t.tb === 'rank')) fpNotes.push(L.frNote);
    // Expandable, collapsed-by-default detail table — the full third-place race with the numbers
    // behind the panel (played, points, GD, goals) plus the clinch mechanics (held / threats).
    // Use the real standings (secured is moot in what-if mode), so it always reflects the race.
    const raceThirds = wif ? bestThirds(viewMatches) : thirds;
    const tt = L.tt;
    const fmtGd = g => g > 0 ? '+' + g : g < 0 ? '' + g : '±0';
    const ttRow = t => `<tr class="${t.secured ? 'bj-tt-locked' : t.rank <= 8 ? 'bj-tt-in' : ''}">
      <td>${t.rank}</td><td>${t.group}</td>
      <td class="bj-tt-team">${TEAM_CODE[t.team] ? `<img class="bj-tt-flag" src="img/flags/${TEAM_CODE[t.team].toLowerCase()}.svg" alt="">` : ''}${disp(t.team)}</td>
      <td>${t.played}</td><td>${t.pts}</td><td>${fmtGd(t.gd)}</td><td>${t.gf}</td>
      <td>${t.rank <= 8 ? '✓' : ''}</td><td>${t.held ? tt.yes : tt.no}</td><td>${t.threats}</td>
    </tr>`;
    const thirdsTable = `<details class="bj-tt"><summary>${tt.toggle}</summary>
      <table class="bj-tt-table"><thead><tr>${tt.cols.map((c, i) =>
        `<th${i === 8 ? ` title="${tt.heldTitle}"` : i === 9 ? ` title="${tt.threatsTitle}"` : ''}>${c}</th>`).join('')}</tr></thead>
      <tbody>${raceThirds.map(ttRow).join('')}</tbody></table></details>`;
    thirdsPanel = `<div class="bj-thirds">
      <div class="bj-thirds-grid">${thirds.map(thirdItem).join('')}</div>
      ${fpNotes.length ? `<div class="bj-th-foot">${fpNotes.join('<br>')}</div>` : ''}
      ${thirdsTable}
    </div>`;
  }

  // Mobile: a round-by-round vertical list (shown instead of the tree on narrow screens,
  // so there is no horizontal scrolling). Reuses the same cards.
  const rounds = [
    [L.stages[0], [73, 74, 75, 76, 77, 78, 79, 80, 81, 82, 83, 84, 85, 86, 87, 88]],
    [L.stages[1], [89, 90, 91, 92, 93, 94, 95, 96]],
    [L.stages[2], [97, 98, 99, 100]],
    [L.stages[3], [101, 102]],
    [L.stages[4], [103]],
    [L.stages[5], [104]],
  ];
  const listHtml = `<div class="bj-list">${rounds.map(([label, nums]) => `<div class="bj-list-round">
    <h3 class="bj-list-head">${label}</h3>
    <div class="bj-list-cards">${nums.map(n => card(n, 'b', true)).join('')}</div>
  </div>`).join('')}</div>`;

  // Forward/back scrubber — only when a game-by-game history is loaded. The forward button
  // is shown but disabled on the latest game, backward disabled on the earliest.
  const scrubOpts = scrub ? snaps.map((s, i) =>
    `<option value="${s.game}"${s.game === scrub.game ? ' selected' : ''}>${L.afterGame(s.seq ?? i + 1)}${i === snaps.length - 1 ? ` · ${L.latestGame}` : ''}</option>`).join('') : '';
  // The fixture that match number played, shown beside the pager (flag + code + score).
  let scrubMatch = '';
  if (scrub) {
    const gm = byMatch.get(scrub.game);
    if (gm && gm.homeScore !== null && gm.awayScore !== null) {
      const mini = t => `${flagImg(t)}<span class="bj-sm-code">${TEAM_CODE[t] || disp(t)}</span>`;
      scrubMatch = `<span class="bj-scrub-match">${mini(gm.homeTeam)}<span class="bj-sm-score">${gm.homeScore}–${gm.awayScore}</span>${mini(gm.awayTeam)}</span>`;
    }
  }
  const scrubBar = scrub ? `<div class="bj-scrub">
    <button class="bj-nav" data-nav="prev"${scrub.atEarliest ? ' disabled' : ''} title="${L.prevGame}">◀</button>
    <select class="bj-scrub-select" aria-label="${L.afterGame(scrub.seq)}">${scrubOpts}</select>
    <button class="bj-nav" data-nav="next"${scrub.atLatest ? ' disabled' : ''} title="${L.nextGame}">▶</button>
    ${scrubMatch}
  </div>` : '';

  // Show where one group's third lands in each combination ("3F → 1E"): the host (group-winner)
  // seed of the round-of-32 match the Annex C table assigns it to, and sort the options by that
  // opponent first, then by combination. With several groups selected we follow the first the user
  // pinned (insertion order); otherwise the lone required group, if there's exactly one.
  const focusGroup = [...pinnedGroups][0] || (requiredGroups.length === 1 ? requiredGroups[0] : null);
  // What-if combination selector (when the allocation table is loaded). The focus group — the one
  // whose opponent the dropdown shows — is marked with an asterisk in its badge.
  const star = g => g === focusGroup ? '*' : '';
  // Qualified groups show as solid badges; once selected (which a qualified group can be, as the
  // focus) they move into the selected list and render as a clickable pin badge instead.
  const lockBadges = lockedGroups.filter(g => !pinnedGroups.has(g)).map(g => `<span class="bj-lock" title="${L.lockedTitle}">${g}${star(g)}</span>`).join('');
  const pinBadges = [...pinnedGroups].sort().map(g => `<span class="bj-lock bj-pin" data-group="${g}" title="${L.pinTitle}">${g}${star(g)}</span>`).join('');
  const hostSeed = {};
  if (focusGroup && ALLOCATIONS) for (const n of [74, 77, 79, 80, 81, 82, 85, 87]) {
    const b = byBracket.get(n);
    if (b) hostSeed[n] = seedCode(b.home, (b.home && b.home.team) || null);
  }
  const targetMatch = c => focusGroup && Object.keys(ALLOCATIONS[c]).find(k => ALLOCATIONS[c][k] === focusGroup);
  const targetSeed = c => { const m = targetMatch(c); return m ? (hostSeed[m] || 'zzz') : ''; };
  const targetOf = c => { const m = targetMatch(c); return m ? ` — 3${focusGroup} → ${hostSeed[m] || '?'}` : ''; };
  // Only combinations that keep every required group (locked + pinned) are still possible.
  const validCombos = ALLOCATIONS ? Object.keys(ALLOCATIONS).filter(c => requiredGroups.every(g => c.includes(g)))
    .sort((a, b) => (focusGroup ? targetSeed(a).localeCompare(targetSeed(b)) : 0) || a.localeCompare(b)) : [];
  const whatIfCtl = ALLOCATIONS ? `<div class="bj-whatif">
    <span class="bj-whatif-label">${L.whatIf}</span>
    <select class="bj-whatif-select">
      <option value=""${!whatIfCombo ? ' selected' : ''}>${L.whatIfActual}</option>
      ${validCombos.map(c => `<option value="${c}"${c === whatIfCombo ? ' selected' : ''}>${c.split('').join('·')}${c === actualCombo ? ' ' + L.whatIfActualTag : ''}${targetOf(c)}</option>`).join('')}
    </select>
    ${lockedGroups.length || pinnedGroups.size ? `<span class="bj-locked"><span class="bj-locked-label">${L.lockedIn}</span>${lockBadges}${pinBadges}</span>` : ''}
  </div>` : '';

  el.innerHTML = scrubBar + whatIfCtl + thirdsPanel + `<div class="bj-scroll"><div class="bj">
    <div class="bj-side bj-side-l">${leftCols}</div>
    ${centre}
    <div class="bj-side bj-side-r">${rightCols}</div>
  </div></div>` + listHtml;
}

// ---- Mobile filters toggle ----
const btnFilters = document.getElementById('btn-filters');
btnFilters.addEventListener('click', () => {
  document.body.classList.toggle('filters-open');
  updateFiltersBtn();
});
function updateFiltersBtn() {
  const active = teamColors.size + selectedCountries.size + selectedVenues.size + (filterOnly ? 1 : 0);
  const open = document.body.classList.contains('filters-open');
  btnFilters.textContent = (open ? L.hideFilters : L.filters) + (active ? L.active(active) : '');
  btnFilters.classList.toggle('on', active > 0);
}

// ---- Timezone toggle ----
const btnTz = document.getElementById('btn-tz');
const subtitle = document.getElementById('subtitle');
function renderAll() {
  for (const v of VIEWS) document.getElementById('btn-' + v).textContent = L.nav[v];
  // "Live bracket" while the group stage is still deciding teams, "Playoff bracket" once it's set
  const groupStage = MATCHES.filter(m => m.matchNumber <= 72);
  const teamsDecided = groupStage.length > 0 && groupStage.every(m => m.homeScore !== null && m.awayScore !== null);
  document.getElementById('btn-bracket').textContent = teamsDecided ? L.bracketSet : L.bracketLive;
  renderTeamsBar();
  updateFiltersBtn();
  renderList();
  renderCalendar();
  renderGroups();
  renderVenues();
  renderBracket();
  btnTz.textContent = tz === 'UTC' ? L.showLocal : L.showUtc;
  subtitle.textContent = L.subtitle(tz === 'UTC' ? 'UTC' : L.localTz(tzAbbr()));
  updateStamp();
  saveFilters();
}
// "Results updated <time>" — from the Last-Modified header of matches.json
// (the sidecar only rewrites the file when results actually change)
let dataUpdatedAt = null;
function updateStamp() {
  if (!dataUpdatedAt) return;
  const el = document.getElementById('last-updated');
  el.hidden = false;
  const fmt = new Intl.DateTimeFormat(L.locale, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: tz });
  el.textContent = `${L.lastUpdated}: ${fmt.format(dataUpdatedAt)} (${tzAbbr()})`;
}
btnTz.addEventListener('click', () => { tz = tz === 'UTC' ? TZ_LOCAL : 'UTC'; renderAll(); });

// ---- View toggle ----
const VIEWS = ['list', 'calendar', 'groups', 'venues', 'bracket'];
for (const v of VIEWS) {
  document.getElementById('btn-' + v).addEventListener('click', () => showView(v));
}
function showView(view) {
  for (const v of VIEWS) {
    document.getElementById(v).hidden = v !== view;
    document.getElementById('btn-' + v).classList.toggle('active', v === view);
  }
  // The bracket shows the whole tree — no filtering — so hide the filter sidebar for it
  document.body.classList.toggle('bracket-view', view === 'bracket');
  document.body.dataset.view = view; // drives view-specific chrome (e.g. the subtitle)
  // Report the active view to GA as a virtual page view (no-op off the production host).
  if (window.gtag) gtag('event', 'page_view', {
    page_title: 'WC2026 · ' + view,
    page_location: location.origin + location.pathname + '#' + view,
  });
}

// Group tags in the list view jump to that group's card in the groups view
list.addEventListener('click', e => {
  const tag = e.target.closest('.group-link');
  if (!tag) return;
  showView('groups');
  document.querySelector(`#groups .group-card[data-group="${tag.dataset.group}"]`)
    ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// Bracket scrubber: step the viewed game forward/back through the history snapshots.
// Landing back on the latest sets bracketViewGame=null so it keeps tracking new results.
document.getElementById('bracket').addEventListener('click', e => {
  // Unpin via a pin badge, or pick/drop a group by clicking its third in the panel. A normal
  // group toggles freely; an already-qualified (locked) group sits in every combination, so it
  // only matters as the focus — it can be picked when nothing else is selected, click again to
  // clear. Either way, re-filter the what-if dropdown.
  const pin = e.target.closest('.bj-pin');
  if (pin && pin.dataset.group) { pinnedGroups.delete(pin.dataset.group); renderBracket(); return; }
  const thItem = e.target.closest('.bj-th-item');
  if (thItem && thItem.dataset.group) {
    const g = thItem.dataset.group;
    if (bjLocked.includes(g)) {
      if (pinnedGroups.has(g)) pinnedGroups.delete(g);
      else if (pinnedGroups.size === 0) pinnedGroups.add(g);
      else return;
    } else {
      pinnedGroups.has(g) ? pinnedGroups.delete(g) : pinnedGroups.add(g);
    }
    renderBracket();
    return;
  }
  const btn = e.target.closest('.bj-nav');
  if (!btn || btn.disabled) return;
  const snaps = BRACKET_HISTORY && BRACKET_HISTORY.snapshots;
  if (!snaps || !snaps.length) return;
  let idx = bracketViewGame === null ? snaps.length - 1 : snaps.findIndex(s => s.game === bracketViewGame);
  if (idx < 0) idx = snaps.length - 1;
  idx = Math.max(0, Math.min(snaps.length - 1, idx + (btn.dataset.nav === 'next' ? 1 : -1)));
  bracketViewGame = idx === snaps.length - 1 ? null : snaps[idx].game;
  renderBracket();
});

// Bracket scrubber dropdown: jump straight to a game. Selecting the latest tracks live again.
document.getElementById('bracket').addEventListener('change', e => {
  if (e.target.closest('.bj-whatif-select')) {
    whatIfCombo = e.target.value || null;
    renderBracket();
    // Re-render replaces the select, so restore focus to keep arrow-key (up/down) navigation working.
    document.querySelector('.bj-whatif-select')?.focus();
    return;
  }
  if (!e.target.closest('.bj-scrub-select')) return;
  const snaps = BRACKET_HISTORY && BRACKET_HISTORY.snapshots;
  if (!snaps || !snaps.length) return;
  const game = parseInt(e.target.value, 10);
  bracketViewGame = snaps[snaps.length - 1].game === game ? null : game;
  renderBracket();
  document.querySelector('.bj-scrub-select')?.focus(); // keep arrow-key navigation working after re-render
});

// ---- Language toggle ----
const btnLangEn = document.getElementById('btn-lang-en');
const btnLangSv = document.getElementById('btn-lang-sv');
function setLang(l) {
  lang = l;
  L = I18N[l];
  try { localStorage.setItem('lang', l); } catch {}
  document.documentElement.lang = l;
  btnLangEn.classList.toggle('active', l === 'en');
  btnLangSv.classList.toggle('active', l === 'sv');
  renderAll();
}
btnLangEn.addEventListener('click', () => setLang('en'));
btnLangSv.addEventListener('click', () => setLang('sv'));

setLang(lang);
showView('bracket');

// ---- Analytics consent (production host only, opt-in) ----
// GA is loaded only after the visitor accepts, so no analytics cookies are set otherwise.
// The choice is remembered in localStorage. showView() fires per-view page_views once gtag exists.
const GA_ID = '__GA_ID__', GA_HOST = 'dev.ardelity.se'; // GA_ID injected at image build time (kept out of the repo)
let gaLoaded = false;
function loadGA() {
  if (gaLoaded) return;
  gaLoaded = true;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', GA_ID, { send_page_view: false }); // SPA: send one page_view per view instead
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
  document.head.appendChild(s);
  const view = document.body.dataset.view || '';
  gtag('event', 'page_view', { page_title: 'WC2026 · ' + view, page_location: location.origin + location.pathname + '#' + view });
}
function setConsent(v) {
  let was = null; try { was = localStorage.getItem('ga-consent'); } catch {}
  try { localStorage.setItem('ga-consent', v); } catch {}
  document.getElementById('cookie-consent')?.remove();
  if (v === 'granted') { loadGA(); return; }
  // Withdrawing a previous acceptance: drop the GA cookies and reload so analytics stops.
  if (gaLoaded || was === 'granted') {
    document.cookie.split(';').forEach(c => {
      const n = c.split('=')[0].trim();
      if (n === '_ga' || n === '_gid' || n.startsWith('_ga_')) {
        for (const d of ['', '; domain=' + location.hostname, '; domain=.' + location.hostname])
          document.cookie = `${n}=; Max-Age=0; path=/${d}`;
      }
    });
    location.reload();
  }
}
// The opt-in/opt-out banner — also reachable any time via the "Cookie settings" link.
function showConsentBanner() {
  document.getElementById('cookie-consent')?.remove();
  const bar = document.createElement('div');
  bar.id = 'cookie-consent';
  bar.innerHTML = `<span>${L.cookieText}</span><span class="cc-actions">` +
    `<button class="cc-accept">${L.cookieAccept}</button>` +
    `<button class="cc-decline">${L.cookieDecline}</button></span>`;
  document.body.appendChild(bar);
  bar.querySelector('.cc-accept').addEventListener('click', () => setConsent('granted'));
  bar.querySelector('.cc-decline').addEventListener('click', () => setConsent('denied'));
}
function initConsent() {
  if (location.hostname !== GA_HOST || !GA_ID.startsWith('G-')) return; // prod only, and only if an ID was injected
  // Persistent way to review/withdraw the choice (GDPR: withdrawing must be as easy as giving).
  const link = document.createElement('button');
  link.id = 'cookie-link';
  link.textContent = L.cookieManage;
  link.addEventListener('click', showConsentBanner);
  document.body.appendChild(link);

  let choice = null;
  try { choice = localStorage.getItem('ga-consent'); } catch {}
  if (choice === 'granted') return loadGA();
  if (choice === 'denied') return;
  showConsentBanner();
}
initConsent();

// ---- Live data refresh ----
// In the cluster an updater sidecar rewrites matches.json with fresh results;
// pick those up on load and every 5 minutes. Fails silently on file:// or offline,
// where the baked-in data above is all there is.
async function refreshData() {
  // Bracket is projected from the same results, so refresh it on the same cycle.
  fetch('bracket.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data && Array.isArray(data.bracket) && JSON.stringify(data) !== JSON.stringify(BRACKET)) {
        BRACKET = data;
        renderBracket();
      }
    })
    .catch(() => { /* keep current bracket (file:// or offline) */ });

  // Third-place allocation table for the what-if selector — static, fetch once.
  if (!ALLOCATIONS) fetch('third-place-allocations.json')
    .then(r => r.ok ? r.json() : null)
    .then(data => { if (data && typeof data === 'object') { ALLOCATIONS = data; renderBracket(); } })
    .catch(() => { /* no what-if data (file:// or offline) */ });

  // Fair-play points (third-place tiebreaker); served only.
  fetch('fairplay.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      const pts = data && (data.points || data);
      if (pts && JSON.stringify(pts) !== JSON.stringify(FAIRPLAY)) { FAIRPLAY = pts; renderBracket(); }
    })
    .catch(() => { /* no fair-play data (file:// or offline) */ });

  // Game-by-game history powers the scrubber; served only (not baked in).
  fetch('bracket-history.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data && Array.isArray(data.snapshots) && JSON.stringify(data) !== JSON.stringify(BRACKET_HISTORY)) {
        BRACKET_HISTORY = data;
        renderBracket();
      }
    })
    .catch(() => { /* no history (file:// or offline) — scrubber stays hidden */ });

  try {
    const res = await fetch('matches.json', { cache: 'no-store' });
    if (!res.ok) return;
    const lm = new Date(res.headers.get('last-modified'));
    if (!isNaN(lm)) dataUpdatedAt = lm;
    const data = await res.json();
    if (Array.isArray(data) && data.length && JSON.stringify(data) !== JSON.stringify(MATCHES)) {
      MATCHES = data;
      renderAll();
    } else {
      updateStamp();
    }
  } catch { /* keep current data */ }
}
refreshData();
setInterval(refreshData, 5 * 60 * 1000);
</script>
