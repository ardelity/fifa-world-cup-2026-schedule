<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1420">
<title>FIFA World Cup 2026 — All Matches</title>
<style>
  :root {
    --bg: #0e1420;
    --card: #182234;
    --card-played: #131b2a;
    --text: #e8edf5;
    --muted: #8b97ab;
    --accent: #5aa7e8;
    --line: #243149;
    --hl-border: #4f8fbf;
    --hl-bg: #15304a;
    --hl-bg2: #1a3a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    line-height: 1.4;
  }
  header {
    padding: 28px 16px 12px;
    text-align: center;
    position: relative;
  }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }
  #last-updated { font-size: .72rem; margin-top: 3px; }

  /* Language selector (flag buttons, top right) */
  #lang-switch {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 6px;
  }
  #lang-switch button {
    background: none;
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 2px;
    line-height: 0;
    cursor: pointer;
    opacity: .55;
  }
  #lang-switch button:hover { opacity: .85; }
  #lang-switch button.active { border-color: var(--accent); opacity: 1; }
  #lang-switch img { width: 18px; height: 21px; border-radius: 3px; display: block; }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 8px 12px 48px;
  }

  /* Groups + Venues views */
  #groups, #venues {
    max-width: 1100px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr));
    gap: 14px;
    align-items: start;
  }
  #groups[hidden], #venues[hidden] { display: none; }
  .venue-city {
    color: var(--muted);
    font-size: .75rem;
    margin: -4px 0 6px;
  }
  .group-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .group-card h3 {
    margin: 0 0 6px;
    font-size: .9rem;
    color: var(--accent);
  }
  .group-card table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: .78rem;
  }
  .group-card th {
    color: var(--muted);
    font-weight: 400;
    font-size: .68rem;
    text-align: right;
    padding: 1px 3px;
  }
  .group-card td {
    padding: 2px 3px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .group-card .t {
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .group-card .t .flag { width: 17px; height: 12px; margin-right: 7px; vertical-align: -1px; }
  .group-card td.pts { font-weight: 700; }
  .group-card tbody tr:nth-child(2) td { border-bottom: 1px dashed var(--line); }
  .group-card { margin-bottom: 0; }
  .gm-list { margin-top: 14px; border-top: 1px solid var(--line); padding: 6px 4px 2px; }
  .gm {
    display: grid;
    grid-template-columns: 110px 1fr auto 42px;
    align-items: center;
    gap: 8px;
    padding: 10px 8px;
    font-size: .8rem;
  }
  .gm + .gm { border-top: 1px dashed var(--line); }
  .gm-date { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gm-teams { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-res { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .gm-res.vs { color: var(--muted); font-weight: 400; }
  .gm-bc { text-align: right; }
  .gm-bc .bc-logo { margin-right: 0; margin-left: 3px; height: 13px; }
  .gm-loc {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: .68rem;
    margin-top: -4px;
  }
  @media (max-width: 480px) {
    .gm { grid-template-columns: 86px 1fr auto 40px; font-size: .72rem; }
  }

  /* Layout: vertical teams filter to the left of the views */
  .layout {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    max-width: 1480px;
    margin: 0 auto;
    padding: 0 12px;
  }
  .content { flex: 1; min-width: 0; }
  main { padding-left: 0; padding-right: 0; }

  /* Team selection / highlighting */
  #teams-bar {
    width: 200px;
    flex-shrink: 0;
    padding: 8px 0 48px;
  }
  #teams-bar .team-chip {
    display: block;
    margin: 4px 0;
  }
  /* Mobile: filters collapse behind a toggle button */
  #btn-filters {
    display: none;
    width: 100%;
    margin-top: 8px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    font: inherit;
    font-size: .9rem;
    cursor: pointer;
  }
  #btn-filters.on { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 900px) {
    /* align-items must stretch again or .content sizes to max-content and overflows */
    .layout { flex-direction: column; align-items: stretch; gap: 10px; }
    #btn-filters { display: block; }
    #teams-bar { display: none; width: 100%; padding: 0; }
    body.filters-open #teams-bar { display: block; }
    #teams-bar .team-chip { display: inline-block; margin: 3px; padding: 5px 12px; }
  }
  .team-chip {
    display: inline-block;
    padding: 3px 11px;
    margin: 3px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #0b101a;
    font-size: .78rem;
    cursor: pointer;
    user-select: none;
  }
  .team-chip:hover { border-color: var(--accent); }
  .filter-toggle { color: var(--muted); margin-bottom: 8px; }
  .filter-toggle.on { border-color: var(--accent); color: var(--accent); background: #15273a; }
  .venue-chip.sel { border-color: var(--accent); color: var(--accent); background: #15273a; }
  .team-chip.sel { background: var(--hl-bg2); font-weight: 600; } /* border + text color set per team */
  .team.sel { font-weight: 700; }
  .match.sel, .match.sel.played { border-color: var(--hl-border); background: var(--hl-bg); }
  .cal-match.sel { background: var(--hl-bg2); }
  .group-card tr.sel td { background: var(--hl-bg); }
  .gm.sel { background: var(--hl-bg); border-radius: 5px; }
  .gm.sel .gm-teams { font-weight: 600; }
  .day {
    margin: 28px 4px 10px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }
  .match {
    display: grid;
    grid-template-columns: 64px 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    margin: 8px 0;
  }
  .match.played { background: var(--card-played); }
  .time {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: .95rem;
  }
  .time small { display: block; font-weight: 400; color: var(--muted); font-size: .7rem; }
  .team { font-size: 1rem; }
  .team.home { text-align: right; }
  .team.away { text-align: left; }
  .team.placeholder { color: var(--muted); font-style: italic; font-size: .9rem; }
  /* Country flag shown next to a team name (list match rows + group tables) */
  .flag { display: inline-block; width: 20px; height: 14px; border: 1px solid var(--line); border-radius: 2px; vertical-align: -2px; object-fit: cover; }
  .team.home .flag { margin-left: 8px; }
  .team.away .flag { margin-right: 8px; }
  .score {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    padding: 2px 10px;
    border-radius: 6px;
    background: #0b101a;
  }
  .score.vs { color: var(--muted); font-weight: 400; background: none; }
  .meta {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: .78rem;
    margin-top: 2px;
  }
  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .meta-bc .bc-logo { margin-right: 0; margin-left: 3px; }
  .meta-loc { margin-top: 0; font-size: .72rem; }
  .stage-tag {
    color: var(--accent);
  }
  .group-link { cursor: pointer; }
  .group-link:hover { text-decoration: underline; }
  .group-card { scroll-margin-top: 10px; }
  .bc-logo {
    height: 15px;
    vertical-align: -3px;
    margin-right: 3px;
  }
  .cal-match .bc-logo { height: 10px; vertical-align: -1px; float: right; margin: 1px 0 0 3px; }
  @media (max-width: 560px) {
    header { padding: 18px 12px 8px; }
    header h1 { font-size: 1.3rem; }
    header p { font-size: .8rem; }
    nav button { padding: 6px 12px; font-size: .85rem; }
    #lang-switch { top: 8px; right: 8px; }
    #lang-switch img { width: 24px; height: 18px; }
    .match { grid-template-columns: 48px 1fr auto 1fr; padding: 8px 10px; gap: 6px; }
    .team { font-size: .88rem; }
    .score { padding: 2px 7px; }
    .meta { font-size: .7rem; }
    .day { font-size: .9rem; margin: 20px 2px 8px; }
  }

  /* View + timezone toggles */
  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  nav button {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 18px;
    font: inherit;
    font-size: .9rem;
    cursor: pointer;
  }
  nav button.active {
    color: var(--text);
    border-color: var(--accent);
    background: #15273a;
  }
  nav .sep {
    width: 1px;
    height: 22px;
    background: var(--line);
    margin: 0 4px;
  }
  nav button.tz { color: var(--text); }

  /* Calendar view */
  #calendar { max-width: 1100px; }
  /* Sticky navigation: jump between months / today while scrolling */
  #cal-nav {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px 8px;
    border-bottom: 1px solid var(--line);
  }
  #cal-nav button {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 14px;
    font: inherit;
    font-size: .85rem;
    cursor: pointer;
  }
  #cal-nav button:hover { border-color: var(--accent); color: var(--text); }
  .month-title {
    margin: 32px 4px 10px;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--accent);
    scroll-margin-top: 58px; /* clear the sticky #cal-nav when jumping */
  }
  .cal-cell.today { border-color: var(--accent); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-weekday {
    text-align: center;
    color: var(--muted);
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 4px 0;
  }
  .cal-cell {
    background: var(--card-played);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 86px;
    padding: 6px;
    font-size: .72rem;
  }
  .cal-cell.empty { background: none; border-color: transparent; }
  .cal-cell.has-matches { background: var(--card); }
  .cal-daynum {
    font-weight: 600;
    font-size: .8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .cal-cell.has-matches .cal-daynum { color: var(--text); }
  .cal-match {
    background: #0b101a;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 3px 5px;
    margin-bottom: 3px;
    line-height: 1.3;
  }
  .cal-match.bc-tv4 { border-color: #f45b6c; }
  .cal-match.bc-svt { border-color: #3fa34d; }
  .cal-match .cm-time { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .cal-match .cm-score { font-weight: 700; }
  .cal-match .cm-teams { display: block; }
  .cal-match .cm-teams.placeholder { color: var(--muted); font-style: italic; }
  .cal-match .cm-short { display: none; }
  /* Mobile: the whole week fits the screen — compact 3-letter team codes, no sideways scrolling */
  @media (max-width: 700px) {
    .cal-grid { gap: 2px; }
    .cal-cell { min-height: 54px; padding: 3px 2px; font-size: .6rem; border-radius: 5px; }
    .cal-daynum { font-size: .68rem; margin-bottom: 2px; }
    .cal-weekday { font-size: .6rem; letter-spacing: 0; }
    .cal-match { padding: 2px 3px; margin-bottom: 2px; }
    .cal-match .bc-logo { display: none; }
    .cal-match .cm-time { display: block; font-size: .56rem; }
    .cal-match .cm-full { display: none; }
    .cal-match .cm-short { display: block; font-size: .6rem; line-height: 1.25; }
    .month-title { margin: 20px 4px 8px; scroll-margin-top: 48px; }
    #cal-nav { gap: 6px; padding: 8px 2px 6px; }
    #cal-nav button { padding: 4px 10px; font-size: .75rem; }
  }

  /* Bracket (knockout) view — center-converging tree */
  #bracket { max-width: 1480px; }
  #bracket[hidden] { display: none; }
  /* The bracket spans the full width and applies no filtering — hide the filter sidebar */
  body.bracket-view #teams-bar,
  body.bracket-view #btn-filters { display: none; }
  /* The timezone subtitle is only relevant to the chronological list — hide it elsewhere */
  #subtitle { display: none; }
  body[data-view="list"] #subtitle { display: block; }
  .bj-empty { color: var(--muted); text-align: center; padding: 40px 12px; }
  /* Game-by-game scrubber */
  .bj-scrub { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0 auto 14px; }
  .bj-nav { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 7px; width: 36px; height: 30px; font-size: .85rem; cursor: pointer; line-height: 1; }
  .bj-nav:hover:not(:disabled) { border-color: var(--accent); }
  .bj-nav:disabled { opacity: .35; cursor: default; }
  .bj-scrub-select { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 7px; height: 30px; padding: 0 8px; font-size: .82rem; font-variant-numeric: tabular-nums; cursor: pointer; }
  .bj-scrub-select:hover { border-color: var(--accent); }
  .bj-scrub-match { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bj-scrub-match .flag { width: 18px; height: 13px; }
  .bj-sm-code { letter-spacing: .02em; }
  .bj-sm-score { font-weight: 700; color: var(--text); padding: 0 2px; }
  /* Mobile: drop the fixture onto its own row below the prev/select/next controls */
  @media (max-width: 700px) {
    .bj-scrub { flex-wrap: wrap; gap: 8px 12px; }
    .bj-scrub-match { flex-basis: 100%; justify-content: center; }
  }
  /* What-if combination selector */
  .bj-whatif { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto 14px; flex-wrap: wrap; }
  .bj-whatif-label { font-size: .8rem; color: var(--muted); }
  .bj-whatif-select { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 7px; height: 30px; padding: 0 8px; font-size: .82rem; cursor: pointer; max-width: 240px; }
  .bj-whatif-select:hover { border-color: var(--accent); }
  .bj-locked { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .bj-locked-label { font-size: .72rem; color: var(--muted); }
  .bj-lock { font-size: .7rem; font-weight: 700; color: #04130a; background: rgba(95, 217, 143, .9); border-radius: 4px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
  .bj-lock.bj-pin { color: var(--accent); background: transparent; border: 1px solid var(--accent); cursor: pointer; }
  .bj-th-item { cursor: pointer; }
  .bj-th-item.pinned { outline: 2px solid var(--accent); outline-offset: -2px; }
  .bj-scroll { padding: 4px 0 16px; }
  /* All levels flex to equal widths so the whole tree fits a wide screen — no horizontal scroll */
  .bj { display: flex; align-items: stretch; width: 100%; }
  .bj-side { display: flex; flex: 3 1 0; min-width: 0; }
  .bj-col { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; }
  .bj-col-head, .bj-round-head { font-size: .78rem; color: var(--muted); text-align: center; padding: 2px 0 10px; white-space: nowrap; }
  .bj-seeds { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
  .bj-seed { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 6px 18px; }

  .bj-card { position: relative; }
  .bj-when { display: flex; justify-content: space-between; gap: 8px; font-size: .6rem; color: var(--muted); padding: 0 3px 2px; }
  .bj-match { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .bj-row { display: flex; align-items: center; gap: 7px; padding: 4px 7px; font-size: .74rem; }
  .bj-row + .bj-row { border-top: 1px solid var(--line); }
  /* Team whose group position is settled (qualified + seeded) */
  .bj-row.bj-decided { background: rgba(95, 217, 143, .16); }
  .bj-flag { flex: 0 0 auto; width: 18px; height: 13px; border: 1px solid var(--line); border-radius: 2px; background: var(--card-played); }
  .bj-flag-sm { width: 14px; height: 10px; border: 1px solid var(--line); border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
  .bj-vs { margin: 0 3px; opacity: .6; }
  .bj-venue { display: flex; align-items: center; gap: 5px; padding: 3px 7px 2px; font-size: .58rem; color: var(--muted); }
  .bj-venue-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .bj-venue-text span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bj-cflag { flex: 0 0 auto; width: 15px; height: 11px; border: 1px solid var(--line); border-radius: 2px; }
  .bj-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bj-name.placeholder { color: var(--muted); }
  .bj-row.bj-win .bj-name { font-weight: 700; }
  .bj-seed-code { flex: 0 0 auto; font-size: .6rem; color: var(--muted); background: var(--card-played); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .bj-score { flex: 0 0 auto; min-width: 10px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bj-num { position: absolute; top: 50%; transform: translateY(-50%); font-size: .64rem; color: var(--muted); text-decoration: underline; pointer-events: none; }
  .bj-card.num-l .bj-num { right: 100%; margin-right: 5px; }
  .bj-card.num-r .bj-num { left: 100%; margin-left: 5px; }
  .bj-card.num-b .bj-num { position: static; transform: none; display: block; text-align: center; margin-top: 5px; }

  /* Center cluster: Final on top, the two semifinals below, third-place play-off at the bottom */
  .bj-center { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 10px; flex: 2 1 0; min-width: 0; }
  .bj-final, .bj-third { width: 100%; max-width: 220px; }
  .bj-final .bj-match { border-color: var(--accent); }
  .bj-sf-row { display: flex; gap: 12px; width: 100%; margin: 20px 0; }
  .bj-sf { flex: 1 1 0; min-width: 0; }
  .bj-third { margin-top: 4px; opacity: .92; }

  /* Best third-placed teams — 4 columns × 3, filled top-to-bottom then left-to-right */
  .bj-thirds { max-width: 1000px; margin: 0 auto 18px; }
  /* 4 columns of 3 teams, filled top-to-bottom then left-to-right */
  .bj-thirds-grid { display: grid; grid-template-rows: repeat(3, auto); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px 14px; }
  .bj-th-item { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); font-size: .74rem; }
  .bj-th-item.q { border-color: var(--hl-border); background: var(--hl-bg); }
  /* Clinched a top-8 third spot — same green as a "decided" bracket slot, overrides the amber projected shading */
  .bj-th-item.s { border-color: var(--accent); background: rgba(95, 217, 143, .18); }
  /* What-if cues: actual current top 8 (left bar), and the intersection with the combination (green + check) */
  .bj-th-item.t8 { box-shadow: inset 3px 0 0 var(--accent); }
  .bj-th-item.match { border-color: var(--accent); background: rgba(95, 217, 143, .22); opacity: 1; }
  .bj-th-match { flex: 0 0 auto; color: var(--accent); font-weight: 700; }
  .bj-th-item:not(.q) { opacity: .5; }
  .bj-th-rank { flex: 0 0 auto; width: 16px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bj-th-team { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bj-th-grp { flex: 0 0 auto; font-size: .62rem; color: var(--muted); white-space: nowrap; }
  .bj-th-gd { flex: 0 0 auto; min-width: 24px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bj-th-pts { flex: 0 0 auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  .bj-tt { max-width: 760px; margin: 12px auto 0; }
  .bj-tt > summary { cursor: pointer; color: var(--muted); font-size: .72rem; padding: 4px 0; user-select: none; }
  .bj-tt > summary:hover { color: var(--text); }
  .bj-tt-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .72rem; font-variant-numeric: tabular-nums; }
  .bj-tt-table th, .bj-tt-table td { padding: 3px 6px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }

  .bj-tt-table th:nth-child(3), .bj-tt-table td.bj-tt-team { text-align: left; }
  .bj-tt-flag { width: 16px; height: 11px; object-fit: cover; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
  .bj-tt-table tr.bj-tt-in td { background: var(--hl-bg); }
  .bj-tt-table tr.bj-tt-locked td { background: rgba(95, 217, 143, .18); font-weight: 600; }
  @media (max-width: 720px) { .bj-thirds-grid { grid-template-rows: repeat(6, auto); } }
  @media (max-width: 480px) { .bj-thirds-grid { grid-template-rows: repeat(12, auto); } }

  /* Mobile round-by-round list — hidden on desktop, shown instead of the tree on phones */
  .bj-list { display: none; max-width: 460px; margin: 0 auto; }
  .bj-list-round { margin-bottom: 16px; }
  .bj-list-head { font-size: .95rem; margin: 0 0 8px; color: var(--text); border-bottom: 1px solid var(--line); padding-bottom: 4px; }

  .bj-list .bj-row { font-size: .82rem; padding: 6px 9px; }
  .bj-list .bj-num { font-size: .68rem; }

  /* Connectors — left side flows right, right side flows left */
  .bj-side-l .bj-col .bj-seeds .bj-seed::after,
  .bj-side-r .bj-col:not(:first-child) .bj-seeds .bj-seed::after {
    content: ''; position: absolute; width: 18px;

  .bj-side-l .bj-col .bj-seeds .bj-seed::after { right: 0; border-right: 2px solid var(--line); }
  .bj-side-r .bj-col:not(:first-child) .bj-seeds .bj-seed::after { left: 0; border-left: 2px solid var(--line); }
  .bj-side-l .bj-col .bj-seeds .bj-seed:nth-child(odd)::after,
  .bj-side-r .bj-col:not(:first-child) .bj-seeds .bj-seed:nth-child(odd)::after { top: 50%; bottom: 0; border-top: 2px solid var(--line); }
  .bj-side-l .bj-col .bj-seeds .bj-seed:nth-child(even)::after,
  .bj-side-r .bj-col:not(:first-child) .bj-seeds .bj-seed:nth-child(even)::after { top: 0; bottom: 50%; border-bottom: 2px solid var(--line); }
  .bj-side-l .bj-col:not(:first-child) .bj-seeds .bj-seed::before {
    content: ''; position: absolute; left: 0; width: 18px; top: 50%; border-top: 2px solid var(--line);
  }
  .bj-side-r .bj-col:not(:last-child) .bj-seeds .bj-seed::before {
    content: ''; position: absolute; right: 0; width: 18px; top: 50%; border-top: 2px solid var(--line);
  }
  /* Quarter-final → semifinal: short stub into the centre cluster */
  .bj-sf-l { position: relative; }
  .bj-sf-r { position: relative; }
  .bj-sf-l::before { content: ''; position: absolute; left: -12px; top: 50%; width: 12px; border-top: 2px solid var(--line); }
  .bj-sf-r::after { content: ''; position: absolute; right: -12px; top: 50%; width: 12px; border-top: 2px solid var(--line); }

  /* Too many columns to fit a phone — fall back to fixed-size cards with horizontal scroll */
  /* Mobile: drop the wide tree, show the round-by-round list (no horizontal scroll) */
  @media (max-width: 700px) {
    .bj-scroll { display: none; }
    .bj-list { display: block; }
  }

  /* Cookie consent banner (analytics opt-in) */
  #cookie-consent { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 1000;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 16px;
    max-width: 640px; margin: 0 auto; padding: 12px 16px; font-size: .85rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  #cookie-consent .cc-actions { display: flex; gap: 8px; }
  #cookie-consent button { border: 1px solid var(--line); border-radius: 7px; padding: 6px 16px; font-size: .82rem; cursor: pointer; }
  #cookie-consent .cc-accept { background: var(--accent); color: #04130a; border-color: var(--accent); font-weight: 600; }
  #cookie-consent .cc-decline { background: var(--card); color: var(--text); }
  #cookie-consent button:hover { opacity: .9; }
  /* Persistent link to review/withdraw the cookie choice */
  #cookie-link { position: fixed; left: 10px; bottom: 8px; z-index: 999; background: none; border: none;
    color: var(--muted); font-size: .68rem; text-decoration: underline; cursor: pointer; padding: 4px; opacity: .6; }
  #cookie-link:hover { opacity: 1; color: var(--text); }

<script>
let MATCHES = /*__MATCHES__*/[];
let BRACKET = /*__BRACKET__*/null; // { combination, bracket:[...] }; baked in, refreshed from bracket.json when served

let BRACKET_HISTORY = null;
let bracketViewGame = null;
// Fair-play points per team ({ team: points }, fewer = better), from fairplay.json (served only).
// Used as the third-place tiebreaker after goals scored.
let FAIRPLAY = null;
// FIFA Men's World Ranking (11 June 2026), static through the group stage — the final

const FIFA_RANK = {
  Argentina: 1, Spain: 2, France: 3, England: 4, Portugal: 5, Brazil: 6, Morocco: 7, Netherlands: 8, Belgium: 9, Germany: 10,
  Croatia: 11, Colombia: 13, Mexico: 14, Senegal: 15, Uruguay: 16, USA: 17, Japan: 18, Switzerland: 19, 'IR Iran': 20, 'Türkiye': 22,
  Ecuador: 23, Austria: 24, 'Korea Republic': 25, Australia: 27, Algeria: 28, Egypt: 29, Canada: 30, Norway: 31, "Côte d'Ivoire": 33, Panama: 34,
  Sweden: 38, Czechia: 40, Paraguay: 41, Scotland: 42, Tunisia: 45, 'Congo DR': 46, Uzbekistan: 50, Qatar: 56, Iraq: 57, 'South Africa': 60,
  'Saudi Arabia': 61, Jordan: 63, 'Bosnia and Herzegovina': 64, 'Cabo Verde': 67, Ghana: 73, 'Curaçao': 82, Haiti: 83, 'New Zealand': 85,
};
// FIFA Annex C: { "<8 sorted group letters>": { "<R32 match no>": "<group whose 3rd plays there>" } }.

let whatIfCombo = null;
// Groups the user has pinned by clicking a third in the panel — required in the what-if dropdown,

let pinnedGroups = new Set();
let bjLocked = [];

const TZ_LOCAL = 'Europe/Stockholm';
let tz = TZ_LOCAL;

// ---- Language ----
let lang = 'sv';
try { lang = localStorage.getItem('lang') || 'sv'; } catch {}
const I18N = {

    pinHint: 'Klicka för att kräva/släppa gruppen i tänk om-kombinationerna',
