<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1420">
<title>FIFA World Cup 2026 — All Matches</title>
<style>
  :root {
    --bg: #0e1420;
    --card: #182234;
    --card-played: #131b2a;
    --text: #e8edf5;
    --muted: #8b97ab;
    --accent: #5aa7e8;
    --line: #243149;
    --hl-border: #4f8fbf;
    --hl-bg: #15304a;
    --hl-bg2: #1a3a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    line-height: 1.4;
  }
  header {
    padding: 28px 16px 12px;
    text-align: center;
    position: relative;
  }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }
  #last-updated { font-size: .72rem; margin-top: 3px; }

  /* Language selector (flag buttons, top right) */
  #lang-switch {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 6px;
  }
  #lang-switch button {
    background: none;
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 2px;
    line-height: 0;
    cursor: pointer;
    opacity: .55;
  }
  #lang-switch button:hover { opacity: .85; }
  #lang-switch button.active { border-color: var(--accent); opacity: 1; }
  #lang-switch img { width: 18px; height: 21px; border-radius: 3px; display: block; }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 8px 12px 48px;
  }

  /* Groups + Venues views */
  #groups, #venues {
    max-width: 1100px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr));
    gap: 14px;
    align-items: start;
  }
  #groups[hidden], #venues[hidden] { display: none; }
  .venue-city {
    color: var(--muted);
    font-size: .75rem;
    margin: -4px 0 6px;
  }
  .group-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .group-card h3 {
    margin: 0 0 6px;
    font-size: .9rem;
    color: var(--accent);
  }
  .group-card table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: .78rem;
  }
  .group-card th {
    color: var(--muted);
    font-weight: 400;
    font-size: .68rem;
    text-align: right;
    padding: 1px 3px;
  }
  .group-card td {
    padding: 2px 3px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .group-card .t {
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .group-card td.pts { font-weight: 700; }
  .group-card tbody tr:nth-child(2) td { border-bottom: 1px dashed var(--line); }
  .group-card { margin-bottom: 0; }
  .gm-list { margin-top: 14px; border-top: 1px solid var(--line); padding: 6px 4px 2px; }
  .gm {
    display: grid;
    grid-template-columns: 110px 1fr auto 42px;
    align-items: center;
    gap: 8px;
    padding: 10px 8px;
    font-size: .8rem;
  }
  .gm + .gm { border-top: 1px dashed var(--line); }
  .gm-date { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gm-teams { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-res { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .gm-res.vs { color: var(--muted); font-weight: 400; }
  .gm-bc { text-align: right; }
  .gm-bc .bc-logo { margin-right: 0; margin-left: 3px; height: 13px; }
  .gm-loc {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: .68rem;
    margin-top: -4px;
  }
  @media (max-width: 480px) {
    .gm { grid-template-columns: 86px 1fr auto 40px; font-size: .72rem; }
  }

  /* Layout: vertical teams filter to the left of the views */
  .layout {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    max-width: 1480px;
    margin: 0 auto;
    padding: 0 12px;
  }
  .content { flex: 1; min-width: 0; }
  main { padding-left: 0; padding-right: 0; }

  /* Team selection / highlighting */
  #teams-bar {
    width: 200px;
    flex-shrink: 0;
    padding: 8px 0 48px;
  }
  #teams-bar .team-chip {
    display: block;
    margin: 4px 0;
  }
  /* Mobile: filters collapse behind a toggle button */
  #btn-filters {
    display: none;
    width: 100%;
    margin-top: 8px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    font: inherit;
    font-size: .9rem;
    cursor: pointer;
  }
  #btn-filters.on { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 900px) {
    /* align-items must stretch again or .content sizes to max-content and overflows */
    .layout { flex-direction: column; align-items: stretch; gap: 10px; }
    #btn-filters { display: block; }
    #teams-bar { display: none; width: 100%; padding: 0; }
    body.filters-open #teams-bar { display: block; }
    #teams-bar .team-chip { display: inline-block; margin: 3px; padding: 5px 12px; }
  }
  .team-chip {
    display: inline-block;
    padding: 3px 11px;
    margin: 3px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #0b101a;
    font-size: .78rem;
    cursor: pointer;
    user-select: none;
  }
  .team-chip:hover { border-color: var(--accent); }
  .filter-toggle { color: var(--muted); margin-bottom: 8px; }
  .filter-toggle.on { border-color: var(--accent); color: var(--accent); background: #15273a; }
  .venue-chip.sel { border-color: var(--accent); color: var(--accent); background: #15273a; }
  .team-chip.sel { background: var(--hl-bg2); font-weight: 600; } /* border + text color set per team */
  .team.sel { font-weight: 700; }
  .match.sel, .match.sel.played { border-color: var(--hl-border); background: var(--hl-bg); }
  .cal-match.sel { background: var(--hl-bg2); }
  .group-card tr.sel td { background: var(--hl-bg); }
  .gm.sel { background: var(--hl-bg); border-radius: 5px; }
  .gm.sel .gm-teams { font-weight: 600; }
  .day {
    margin: 28px 4px 10px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }
  .match {
    display: grid;
    grid-template-columns: 64px 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    margin: 8px 0;
  }
  .match.played { background: var(--card-played); }
  .time {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: .95rem;
  }
  .time small { display: block; font-weight: 400; color: var(--muted); font-size: .7rem; }
  .team { font-size: 1rem; }
  .team.home { text-align: right; }
  .team.away { text-align: left; }
  .team.placeholder { color: var(--muted); font-style: italic; font-size: .9rem; }
  .score {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    padding: 2px 10px;
    border-radius: 6px;
    background: #0b101a;
  }
  .score.vs { color: var(--muted); font-weight: 400; background: none; }
  .meta {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: .78rem;
    margin-top: 2px;
  }
  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .meta-bc .bc-logo { margin-right: 0; margin-left: 3px; }
  .meta-loc { margin-top: 0; font-size: .72rem; }
  .stage-tag {
    color: var(--accent);
  }
  .group-link { cursor: pointer; }
  .group-link:hover { text-decoration: underline; }
  .group-card { scroll-margin-top: 10px; }
  .bc-logo {
    height: 15px;
    vertical-align: -3px;
    margin-right: 3px;
  }
  .cal-match .bc-logo { height: 10px; vertical-align: -1px; float: right; margin: 1px 0 0 3px; }
  @media (max-width: 560px) {
    header { padding: 18px 12px 8px; }
    header h1 { font-size: 1.3rem; }
    header p { font-size: .8rem; }
    nav button { padding: 6px 12px; font-size: .85rem; }
    #lang-switch { top: 8px; right: 8px; }
    #lang-switch img { width: 24px; height: 18px; }
    .match { grid-template-columns: 48px 1fr auto 1fr; padding: 8px 10px; gap: 6px; }
    .team { font-size: .88rem; }
    .score { padding: 2px 7px; }
    .meta { font-size: .7rem; }
    .day { font-size: .9rem; margin: 20px 2px 8px; }
  }

  /* View + timezone toggles */
  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  nav button {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 18px;
    font: inherit;
    font-size: .9rem;
    cursor: pointer;
  }
  nav button.active {
    color: var(--text);
    border-color: var(--accent);
    background: #15273a;
  }
  nav .sep {
    width: 1px;
    height: 22px;
    background: var(--line);
    margin: 0 4px;
  }
  nav button.tz { color: var(--text); }

  /* Calendar view */
  #calendar { max-width: 1100px; }
  /* Sticky navigation: jump between months / today while scrolling */
  #cal-nav {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px 8px;
    border-bottom: 1px solid var(--line);
  }
  #cal-nav button {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 14px;
    font: inherit;
    font-size: .85rem;
    cursor: pointer;
  }
  #cal-nav button:hover { border-color: var(--accent); color: var(--text); }
  .month-title {
    margin: 32px 4px 10px;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--accent);
    scroll-margin-top: 58px; /* clear the sticky #cal-nav when jumping */
  }
  .cal-cell.today { border-color: var(--accent); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-weekday {
    text-align: center;
    color: var(--muted);
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 4px 0;
  }
  .cal-cell {
    background: var(--card-played);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 86px;
    padding: 6px;
    font-size: .72rem;
  }
  .cal-cell.empty { background: none; border-color: transparent; }
  .cal-cell.has-matches { background: var(--card); }
  .cal-daynum {
    font-weight: 600;
    font-size: .8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .cal-cell.has-matches .cal-daynum { color: var(--text); }
  .cal-match {
    background: #0b101a;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 3px 5px;
    margin-bottom: 3px;
    line-height: 1.3;
  }
  .cal-match.bc-tv4 { border-color: #f45b6c; }
  .cal-match.bc-svt { border-color: #3fa34d; }
  .cal-match .cm-time { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .cal-match .cm-score { font-weight: 700; }
  .cal-match .cm-teams { display: block; }
  .cal-match .cm-teams.placeholder { color: var(--muted); font-style: italic; }
  .cal-match .cm-short { display: none; }
  /* Mobile: the whole week fits the screen — compact 3-letter team codes, no sideways scrolling */
  @media (max-width: 700px) {
    .cal-grid { gap: 2px; }
    .cal-cell { min-height: 54px; padding: 3px 2px; font-size: .6rem; border-radius: 5px; }
    .cal-daynum { font-size: .68rem; margin-bottom: 2px; }
    .cal-weekday { font-size: .6rem; letter-spacing: 0; }
    .cal-match { padding: 2px 3px; margin-bottom: 2px; }
    .cal-match .bc-logo { display: none; }
    .cal-match .cm-time { display: block; font-size: .56rem; }
    .cal-match .cm-full { display: none; }
    .cal-match .cm-short { display: block; font-size: .6rem; line-height: 1.25; }
    .month-title { margin: 20px 4px 8px; scroll-margin-top: 48px; }
    #cal-nav { gap: 6px; padding: 8px 2px 6px; }
    #cal-nav button { padding: 4px 10px; font-size: .75rem; }
  }

  /* Bracket (knockout) view — center-converging tree */
  #bracket { max-width: 1480px; }
  #bracket[hidden] { display: none; }
  /* The bracket spans the full width and applies no filtering — hide the filter sidebar */
  body.bracket-view #teams-bar,
  body.bracket-view #btn-filters { display: none; }
  .bj-empty { color: var(--muted); text-align: center; padding: 40px 12px; }
  .bj-scroll { padding: 4px 0 16px; }
  /* All levels flex to equal widths so the whole tree fits a wide screen — no horizontal scroll */
  .bj { display: flex; align-items: stretch; width: 100%; }
  .bj-side { display: flex; flex: 3 1 0; min-width: 0; }
  .bj-col { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; }
  .bj-col-head, .bj-round-head { font-size: .78rem; color: var(--muted); text-align: center; padding: 2px 0 10px; white-space: nowrap; }
  .bj-seeds { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
  .bj-seed { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 6px 18px; }

  .bj-card { position: relative; }
  .bj-when { display: flex; justify-content: space-between; gap: 8px; font-size: .6rem; color: var(--muted); padding: 0 3px 2px; }
  .bj-match { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .bj-row { display: flex; align-items: center; gap: 7px; padding: 4px 7px; font-size: .74rem; }
  .bj-row + .bj-row { border-top: 1px solid var(--line); }
  /* Team whose group position is settled (qualified + seeded) */
  .bj-row.bj-decided { background: rgba(95, 217, 143, .16); }
  .bj-flag { flex: 0 0 auto; width: 18px; height: 13px; border: 1px solid var(--line); border-radius: 2px; background: var(--card-played); }
  .bj-flag-sm { width: 14px; height: 10px; border: 1px solid var(--line); border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
  .bj-vs { margin: 0 3px; opacity: .6; }
  .bj-venue { display: flex; align-items: center; gap: 5px; padding: 3px 7px 2px; font-size: .58rem; color: var(--muted); }
  .bj-venue-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .bj-venue-text span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bj-cflag { flex: 0 0 auto; width: 15px; height: 11px; border: 1px solid var(--line); border-radius: 2px; }
  .bj-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bj-name.placeholder { color: var(--muted); }
  .bj-row.bj-win .bj-name { font-weight: 700; }
  .bj-seed-code { flex: 0 0 auto; font-size: .6rem; color: var(--muted); background: var(--card-played); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .bj-score { flex: 0 0 auto; min-width: 10px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bj-num { position: absolute; top: 50%; transform: translateY(-50%); font-size: .64rem; color: var(--muted); text-decoration: underline; pointer-events: none; }
  .bj-card.num-l .bj-num { right: 100%; margin-right: 5px; }
  .bj-card.num-r .bj-num { left: 100%; margin-left: 5px; }
  .bj-card.num-b .bj-num { position: static; transform: none; display: block; text-align: center; margin-top: 5px; }

  /* Center cluster: Final on top, the two semifinals below, third-place play-off at the bottom */
  .bj-center { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 10px; flex: 2 1 0; min-width: 0; }
  .bj-final, .bj-third { width: 100%; max-width: 220px; }
  .bj-final .bj-match { border-color: var(--accent); }
  .bj-sf-row { display: flex; gap: 12px; width: 100%; margin: 20px 0; }
  .bj-sf { flex: 1 1 0; min-width: 0; }
  .bj-third { margin-top: 4px; opacity: .92; }

  /* Best third-placed teams — 3 columns × 4, filled top-to-bottom then left-to-right */
  .bj-thirds { max-width: 760px; margin: 0 auto 18px; }
  .bj-thirds-title { font-size: .9rem; margin: 0 0 10px; text-align: center; color: var(--text); }
  .bj-thirds-grid { display: grid; grid-template-rows: repeat(4, auto); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px 14px; }
  .bj-th-item { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); font-size: .74rem; }
  .bj-th-item.q { border-color: var(--hl-border); background: var(--hl-bg); }
  .bj-th-item:not(.q) { opacity: .5; }
  .bj-th-rank { flex: 0 0 auto; width: 16px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bj-th-team { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bj-th-grp { flex: 0 0 auto; font-size: .62rem; color: var(--muted); white-space: nowrap; }
  .bj-th-gd { flex: 0 0 auto; min-width: 24px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bj-th-pts { flex: 0 0 auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bj-combo { text-align: center; color: var(--muted); font-size: .74rem; margin-top: 12px; }
  @media (max-width: 720px) { .bj-thirds-grid { grid-template-rows: repeat(6, auto); } }
  @media (max-width: 480px) { .bj-thirds-grid { grid-template-rows: repeat(12, auto); } }

  /* Mobile round-by-round list — hidden on desktop, shown instead of the tree on phones */
  .bj-list { display: none; max-width: 460px; margin: 0 auto; }
  .bj-list-round { margin-bottom: 16px; }
  .bj-list-head { font-size: .95rem; margin: 0 0 8px; color: var(--text); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .bj-list-cards { display: flex; flex-direction: column; gap: 10px; }
  .bj-list .bj-card { width: 100%; }
  .bj-list .bj-when { font-size: .66rem; }
  .bj-list .bj-row { font-size: .82rem; padding: 6px 9px; }
  .bj-list .bj-num { font-size: .68rem; }

  /* Connectors — left side flows right, right side flows left */
  .bj-side-l .bj-col .bj-seeds .bj-seed::after,
  .bj-side-r .bj-col:not(:first-child) .bj-seeds .bj-seed::after {
    content: ''; position: absolute; width: 18px;
  }
  .bj-side-l .bj-col .bj-seeds .bj-seed::after { right: 0; border-right: 2px solid var(--line); }
  .bj-side-r .bj-col:not(:first-child) .bj-seeds .bj-seed::after { left: 0; border-left: 2px solid var(--line); }
  .bj-side-l .bj-col .bj-seeds .bj-seed:nth-child(odd)::after,
  .bj-side-r .bj-col:not(:first-child) .bj-seeds .bj-seed:nth-child(odd)::after { top: 50%; bottom: 0; border-top: 2px solid var(--line); }
  .bj-side-l .bj-col .bj-seeds .bj-seed:nth-child(even)::after,
  .bj-side-r .bj-col:not(:first-child) .bj-seeds .bj-seed:nth-child(even)::after { top: 0; bottom: 50%; border-bottom: 2px solid var(--line); }
  .bj-side-l .bj-col:not(:first-child) .bj-seeds .bj-seed::before {
    content: ''; position: absolute; left: 0; width: 18px; top: 50%; border-top: 2px solid var(--line);
  }
  .bj-side-r .bj-col:not(:last-child) .bj-seeds .bj-seed::before {
    content: ''; position: absolute; right: 0; width: 18px; top: 50%; border-top: 2px solid var(--line);
  }
  /* Quarter-final → semifinal: short stub into the centre cluster */
  .bj-sf-l { position: relative; }
  .bj-sf-r { position: relative; }
  .bj-sf-l::before { content: ''; position: absolute; left: -12px; top: 50%; width: 12px; border-top: 2px solid var(--line); }
  .bj-sf-r::after { content: ''; position: absolute; right: -12px; top: 50%; width: 12px; border-top: 2px solid var(--line); }

  /* Too many columns to fit a phone — fall back to fixed-size cards with horizontal scroll */
  /* Mobile: drop the wide tree, show the round-by-round list (no horizontal scroll) */
  @media (max-width: 700px) {
    .bj-scroll { display: none; }
    .bj-list { display: block; }
  }
</style>
</head>
<body>
<header>
  <div id="lang-switch">
    <button id="btn-lang-en" title="English"><img src="img/gb.svg" alt="English"></button>
    <button id="btn-lang-sv" title="Svenska"><img src="img/se.svg" alt="Svenska"></button>
  </div>
  <h1>FIFA World Cup 2026</h1>
  <p id="subtitle">Alla 104 matcher, sorterade efter avsparkstid.</p>
  <p id="last-updated" hidden></p>
  <nav>

  <div class="content">
    <main id="list" hidden></main>
    <main id="calendar" hidden></main>
    <main id="groups"></main>
    <main id="venues" hidden></main>
    <main id="bracket" hidden></main>
  </div>
</div>
<script>
let MATCHES = /*__MATCHES__*/[];
let BRACKET = /*__BRACKET__*/null; // { combination, bracket:[...] }; baked in, refreshed from bracket.json when served

const TZ_LOCAL = 'Europe/Stockholm';
let tz = TZ_LOCAL;

// ---- Language ----
let lang = 'sv';
try { lang = localStorage.getItem('lang') || 'sv'; } catch {}
const I18N = {
  en: {
    locale: 'en-GB',
    nav: { list: 'List', calendar: 'Calendar', groups: 'Groups', venues: 'Venues', bracket: 'Bracket' },
    showLocal: 'Show Stockholm time', showUtc: 'Show UTC',
    filters: 'Filters & teams', hideFilters: 'Hide filters & teams',
    active: n => ` · ${n} active`,
    hostCountry: 'Host country', hostCountryTip: 'Click a country to show only matches played there',
    venuesHeading: 'Venues', venuesTip: 'Click a venue to show only its matches',
    teamsHeading: 'Teams', teamsTip: 'Click a team to highlight it in all views',
    onlySelected: 'Only selected', onlySelectedTip: 'Show only matches involving the selected teams',
    groupWinner: g => `Group ${g} winner`,
    runnerUp: g => `Group ${g} runner-up`,
    thirdPlace: l => `3rd place (${l})`,
    tbd: 'TBD',
    stages: ['Round of 32', 'Round of 16', 'Quarter-final', 'Semi-final', 'Third place', 'Final'],
    thTeam: 'Team', th: ['P', 'W', 'D', 'L', '+/-', 'Pts'],
    match: 'Match',
    today: 'Today',
    weekdays: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
    subtitle: tzDesc => `All 104 matches, sorted by kick-off time. Times are ${tzDesc}.`,
    localTz: abbr => `Europe/Stockholm (${abbr})`,
    lastUpdated: 'Results updated',
    bracketEmpty: 'Bracket data is not available yet.',
    bestThirds: 'Best third-placed teams (top 8 advance)',
    combination: (c, n) => `Third-place combination in use: ${c} — ${n} of 495`,
    bracketLive: 'Live bracket',
    bracketSet: 'Playoff bracket'
  },
  sv: {
    locale: 'sv-SE',
    nav: { list: 'Lista', calendar: 'Kalender', groups: 'Grupper', venues: 'Arenor', bracket: 'Slutspel' },
    showLocal: 'Visa svensk tid', showUtc: 'Visa UTC',
    filters: 'Filter & lag', hideFilters: 'Dölj filter & lag',
    active: n => ` · ${n} aktiva`,
    hostCountry: 'Värdland', hostCountryTip: 'Klicka på ett land för att bara visa matcher som spelas där',
    venuesHeading: 'Arenor', venuesTip: 'Klicka på en arena för att bara visa dess matcher',
    teamsHeading: 'Lag', teamsTip: 'Klicka på ett lag för att markera det i alla vyer',
    onlySelected: 'Endast valda', onlySelectedTip: 'Visa bara matcher med de valda lagen',
    groupWinner: g => `Vinnare grupp ${g}`,
    runnerUp: g => `Tvåa grupp ${g}`,
    thirdPlace: l => `Trea (${l})`,
    tbd: 'TBD',
    stages: ['Sextondelsfinal', 'Åttondelsfinal', 'Kvartsfinal', 'Semifinal', 'Bronsmatch', 'Final'],
    thTeam: 'Lag', th: ['S', 'V', 'O', 'F', '+/-', 'P'],
    match: 'Match',
    today: 'Idag',
    weekdays: ['Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör', 'Sön'],
    subtitle: tzDesc => `Alla 104 matcher, sorterade efter avsparkstid. Tiderna visas i ${tzDesc}.`,
    localTz: abbr => `svensk tid (${abbr})`,
    lastUpdated: 'Resultaten uppdaterade',
    bracketEmpty: 'Slutspelsträdet är inte tillgängligt ännu.',
    bestThirds: 'Bästa grupptreor (8 bästa går vidare)',
    combination: (c, n) => `Grupptrea-kombination som används: ${c} — ${n} av 495`,
    bracketLive: 'Live slutspel',
    bracketSet: 'Slutspel'
  }
};
let L = I18N[lang] ?? I18N.sv;

// Swedish team/country names (only those that differ from the English source data)
const TEAM_SV = {
  'Algeria': 'Algeriet', 'Australia': 'Australien', 'Austria': 'Österrike', 'Belgium': 'Belgien',
  'Bosnia and Herzegovina': 'Bosnien-Hercegovina', 'Brazil': 'Brasilien', 'Cabo Verde': 'Kap Verde',
  'Canada': 'Kanada', 'Congo DR': 'DR Kongo', 'Croatia': 'Kroatien', 'Czechia': 'Tjeckien',
  "Côte d'Ivoire": 'Elfenbenskusten', 'Egypt': 'Egypten', 'France': 'Frankrike', 'Germany': 'Tyskland',
  'IR Iran': 'Iran', 'Iraq': 'Irak', 'Jordan': 'Jordanien', 'Korea Republic': 'Sydkorea',
  'Mexico': 'Mexiko', 'Morocco': 'Marocko', 'Netherlands': 'Nederländerna', 'New Zealand': 'Nya Zeeland',
  'Norway': 'Norge', 'Saudi Arabia': 'Saudiarabien', 'Scotland': 'Skottland', 'South Africa': 'Sydafrika',
  'Spain': 'Spanien', 'Sweden': 'Sverige', 'Switzerland': 'Schweiz', 'Tunisia': 'Tunisien',
  'Türkiye': 'Turkiet'
};
// FIFA three-letter codes — used in the compact mobile calendar
const TEAM_CODE = {
  'Algeria': 'ALG', 'Argentina': 'ARG', 'Australia': 'AUS', 'Austria': 'AUT', 'Belgium': 'BEL',
  'Bosnia and Herzegovina': 'BIH', 'Brazil': 'BRA', 'Cabo Verde': 'CPV', 'Canada': 'CAN',
  'Colombia': 'COL', 'Congo DR': 'COD', 'Croatia': 'CRO', 'Curaçao': 'CUW', 'Czechia': 'CZE',
  "Côte d'Ivoire": 'CIV', 'Ecuador': 'ECU', 'Egypt': 'EGY', 'England': 'ENG', 'France': 'FRA',
  'Germany': 'GER', 'Ghana': 'GHA', 'Haiti': 'HAI', 'IR Iran': 'IRN', 'Iraq': 'IRQ',
  'Japan': 'JPN', 'Jordan': 'JOR', 'Korea Republic': 'KOR', 'Mexico': 'MEX', 'Morocco': 'MAR',
  'Netherlands': 'NED', 'New Zealand': 'NZL', 'Norway': 'NOR', 'Panama': 'PAN', 'Paraguay': 'PAR',
  'Portugal': 'POR', 'Qatar': 'QAT', 'Saudi Arabia': 'KSA', 'Scotland': 'SCO', 'Senegal': 'SEN',
  'South Africa': 'RSA', 'Spain': 'ESP', 'Sweden': 'SWE', 'Switzerland': 'SUI', 'Tunisia': 'TUN',
  'Türkiye': 'TUR', 'Uruguay': 'URU', 'USA': 'USA', 'Uzbekistan': 'UZB'
};
// Display name in the active language; selection state always keys on the English source name
const disp = name => lang === 'sv' ? (TEAM_SV[name] ?? name) : name;
const dispGroup = g => lang === 'sv' ? g.replace('Group', 'Grupp') : g;
// sv-SE formats weekday/month names in lowercase — capitalize for headings
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// Per-team highlight colors — warm/pastel tones that read well on the dark navy background
const PALETTE = ['#f2a35c', '#e07bea', '#6fd98f', '#f4838f', '#c4a7ff', '#ffd166', '#5ee0c2', '#cde06c'];
const teamColors = new Map(); // team -> color; membership in this map = selected
const isSel = name => teamColors.has(name);
const colorOf = name => teamColors.get(name);
let filterOnly = false;
const selectedVenues = new Set(); // keyed by m.location (no selection = show all)
const selectedCountries = new Set();
// Team filter (when toggled on), country filter and venue filter combine
const matchVisible = m =>
  (!filterOnly || teamColors.size === 0 || isSel(m.homeTeam) || isSel(m.awayTeam))
  && (selectedCountries.size === 0 || selectedCountries.has(m.country))
  && (selectedVenues.size === 0 || selectedVenues.has(m.location));

// Filter selections persist across sessions (same localStorage approach as the language)
function saveFilters() {
  try {
    localStorage.setItem('filters', JSON.stringify({
      teams: [...teamColors],
      only: filterOnly,
      venues: [...selectedVenues],
      countries: [...selectedCountries],
    }));
  } catch {}
}
(function loadFilters() {
  try {
    const f = JSON.parse(localStorage.getItem('filters'));
    if (!f) return;
    for (const [team, color] of f.teams ?? []) teamColors.set(team, color);
    filterOnly = !!f.only;
    for (const v of f.venues ?? []) selectedVenues.add(v);
    for (const c of f.countries ?? []) selectedCountries.add(c);
  } catch {}
})();

function toggleTeam(team) {
  if (isSel(team)) { teamColors.delete(team); return; }
  const used = new Set(teamColors.values());
  teamColors.set(team, PALETTE.find(c => !used.has(c)) ?? PALETTE[teamColors.size % PALETTE.length]);
}

// Team name, colored if selected
const teamSpan = name => isSel(name) ? `<span style="color:${colorOf(name)}">${disp(name)}</span>` : disp(name);

function stageOf(n) {
  if (n <= 72) return null;            // group stage: show the group instead
  if (n <= 88) return L.stages[0];
  if (n <= 96) return L.stages[1];
  if (n <= 100) return L.stages[2];
  if (n <= 102) return L.stages[3];
  if (n === 103) return L.stages[4];
  return L.stages[5];
}

function bcBadge(match) {
  if (!match.broadcaster) return '';
  return match.broadcaster.split('/').map(ch =>
    `<img class="bc-logo" src="img/${ch.toLowerCase()}.svg" alt="${ch}" title="${ch}">`
  ).join('');
}

function prettyTeam(name) {
  let m;
  if ((m = /^1([A-L])$/.exec(name))) return { text: L.groupWinner(m[1]), ph: true };
  if ((m = /^2([A-L])$/.exec(name))) return { text: L.runnerUp(m[1]), ph: true };
  if ((m = /^3([A-L]+)$/.exec(name))) return { text: L.thirdPlace(m[1].split('').join('/')), ph: true };
  if (name === 'To be announced') return { text: L.tbd, ph: true };
  return { text: disp(name), ph: false };
}

// Date + time of a match in the active timezone
function partsFor(iso) {
  const p = new Intl.DateTimeFormat('en-CA', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).formatToParts(new Date(iso));
  const get = t => p.find(x => x.type === t).value;
  return { date: `${get('year')}-${get('month')}-${get('day')}`, time: `${get('hour')}:${get('minute')}` };
}

// Abbreviation like "UTC" / "CEST" (whole tournament is June–July, so one sample suffices)
function tzAbbr() {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: tz, timeZoneName: 'short' })
    .formatToParts(new Date(MATCHES[0].dateUtc));
  return p.find(x => x.type === 'timeZoneName')?.value || tz;
}

const list = document.getElementById('list');
const calendar = document.getElementById('calendar');

function renderList() {
  list.innerHTML = '';
  const fmtDay = new Intl.DateTimeFormat(L.locale, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: tz });
  const abbr = tzAbbr();
  let currentDay = '';

  for (const match of MATCHES) {
    if (!matchVisible(match)) continue;
    const dt = new Date(match.dateUtc);
    const day = cap(fmtDay.format(dt));
    if (day !== currentDay) {
      currentDay = day;
      const h = document.createElement('div');
      h.className = 'day';
      h.textContent = day;
      list.appendChild(h);
    }

    const home = prettyTeam(match.homeTeam);
    const away = prettyTeam(match.awayTeam);
    const played = match.homeScore !== null && match.awayScore !== null;
    const stage = stageOf(match.matchNumber);
    const metaParts = [`${L.match} ${match.matchNumber}`, stage
      ? `<span class="stage-tag">${stage}</span>`
      : `<span class="stage-tag group-link" data-group="${match.group}">${dispGroup(match.group)}</span>`];

    const card = document.createElement('div');
    card.className = 'match' + (played ? ' played' : '')
      + (isSel(match.homeTeam) || isSel(match.awayTeam) ? ' sel' : '');
    card.innerHTML = `
      <div class="time">${partsFor(match.dateUtc).time}<small>${abbr}</small></div>
      <div class="team home${home.ph ? ' placeholder' : ''}${isSel(match.homeTeam) ? ' sel' : ''}">${isSel(match.homeTeam) ? teamSpan(match.homeTeam) : home.text}</div>
      <div class="score${played ? '' : ' vs'}">${played ? match.homeScore + ' – ' + match.awayScore : 'vs'}</div>
      <div class="team away${away.ph ? ' placeholder' : ''}${isSel(match.awayTeam) ? ' sel' : ''}">${isSel(match.awayTeam) ? teamSpan(match.awayTeam) : away.text}</div>
      <div class="meta meta-row"><span>${metaParts.join(' · ')}</span><span class="meta-bc">${bcBadge(match)}</span></div>
      <div class="meta meta-loc">${match.stadium}, ${match.city}, ${disp(match.country)}</div>`;
    list.appendChild(card);
  }
}

function renderCalendar() {
  calendar.innerHTML = '';

  const byDate = new Map(); // 'YYYY-MM-DD' in active tz -> [{match, time}]
  for (const match of MATCHES) {
    if (!matchVisible(match)) continue;
    const { date, time } = partsFor(match.dateUtc);
    if (!byDate.has(date)) byDate.set(date, []);
    byDate.get(date).push({ match, time });
  }

  const fmtMonth = new Intl.DateTimeFormat(L.locale, { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const months = [...new Set([...byDate.keys()].map(k => k.slice(0, 7)))].sort();

  const navBar = document.createElement('div');
  navBar.id = 'cal-nav';
  calendar.appendChild(navBar);
  const todayKey = partsFor(new Date().toISOString()).date;
  let todayCell = null;

  for (const ym of months) {
    const [year, month] = ym.split('-').map(Number);
    const first = new Date(Date.UTC(year, month - 1, 1));
    const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();

    const title = document.createElement('div');
    title.className = 'month-title';
    title.textContent = cap(fmtMonth.format(first));
    calendar.appendChild(title);

    const monthBtn = document.createElement('button');
    monthBtn.textContent = title.textContent;
    monthBtn.addEventListener('click', () => title.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    navBar.appendChild(monthBtn);

    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    for (const wd of L.weekdays) {
      const h = document.createElement('div');
      h.className = 'cal-weekday';
      h.textContent = wd;
      grid.appendChild(h);
    }

    const leadingBlanks = (first.getUTCDay() + 6) % 7; // Monday-first offset
    for (let i = 0; i < leadingBlanks; i++) {
      const blank = document.createElement('div');
      blank.className = 'cal-cell empty';
      grid.appendChild(blank);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const key = `${ym}-${String(day).padStart(2, '0')}`;
      const dayMatches = byDate.get(key) || [];
      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (dayMatches.length ? ' has-matches' : '');
      if (key === todayKey) { cell.classList.add('today'); todayCell = cell; }
      const num = document.createElement('div');
      num.className = 'cal-daynum';
      num.textContent = day;
      cell.appendChild(num);

      // Compact code for the mobile grid: FIFA code, or the raw placeholder (1A, 3ABC, TBD)
      const shortName = n => TEAM_CODE[n] ?? (n === 'To be announced' ? L.tbd : n);
      const shortSpan = n => isSel(n) ? `<span style="color:${colorOf(n)}">${shortName(n)}</span>` : shortName(n);

      for (const { match, time } of dayMatches) {
        const home = prettyTeam(match.homeTeam);
        const away = prettyTeam(match.awayTeam);
        const played = match.homeScore !== null && match.awayScore !== null;
        const mid = played ? `<span class="cm-score">${match.homeScore}–${match.awayScore}</span>` : '–';
        const entry = document.createElement('div');
        entry.className = 'cal-match'
          + (match.broadcaster ? (match.broadcaster.startsWith('SVT') ? ' bc-svt' : ' bc-tv4') : '')
          + (isSel(match.homeTeam) || isSel(match.awayTeam) ? ' sel' : '');
        entry.title = `${home.text} vs ${away.text} · ${match.stadium}, ${match.city}, ${disp(match.country)} · ${L.match} ${match.matchNumber}`
          + (match.broadcaster ? ` · ${match.broadcaster}` : '');
        entry.innerHTML = `<span class="cm-time">${time}</span>${bcBadge(match)}
          <span class="cm-teams cm-full${home.ph || away.ph ? ' placeholder' : ''}">${isSel(match.homeTeam) ? teamSpan(match.homeTeam) : home.text} ${mid} ${isSel(match.awayTeam) ? teamSpan(match.awayTeam) : away.text}</span>
          <span class="cm-teams cm-short${home.ph || away.ph ? ' placeholder' : ''}">${shortSpan(match.homeTeam)}<br>${shortSpan(match.awayTeam)}${played ? `<br><span class="cm-score">${match.homeScore}–${match.awayScore}</span>` : ''}</span>`;
        cell.appendChild(entry);
      }
      grid.appendChild(cell);
    }
    calendar.appendChild(grid);
  }

  if (todayCell) {
    const btn = document.createElement('button');
    btn.textContent = L.today;
    btn.addEventListener('click', () => todayCell.scrollIntoView({ behavior: 'smooth', block: 'center' }));
    navBar.appendChild(btn);
  }
}

// ---- Groups sidebar ----
function computeGroups() {
  const groups = new Map(); // 'Group A' -> Map(team -> stats)
  for (const m of MATCHES) {
    if (m.matchNumber > 72) continue;
    if (!groups.has(m.group)) groups.set(m.group, new Map());
    const g = groups.get(m.group);
    for (const t of [m.homeTeam, m.awayTeam]) {
      if (!g.has(t)) g.set(t, { team: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 });
    }
    if (m.homeScore === null || m.awayScore === null) continue;
    const h = g.get(m.homeTeam), a = g.get(m.awayTeam);
    h.p++; a.p++;
    h.gf += m.homeScore; h.ga += m.awayScore;
    a.gf += m.awayScore; a.ga += m.homeScore;
    if (m.homeScore > m.awayScore) { h.w++; a.l++; h.pts += 3; }
    else if (m.homeScore < m.awayScore) { a.w++; h.l++; a.pts += 3; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  }
  // Sort: points, goal difference, goals scored, name (simplified FIFA tiebreakers)
  return [...groups.entries()].sort((x, y) => x[0].localeCompare(y[0])).map(([name, teams]) => ({
    name,
    rows: [...teams.values()].sort((a, b) =>
      b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf || a.team.localeCompare(b.team))
  }));
}

// The 12 third-placed teams ranked best-first (points, goal difference, goals for, group);
// the top 8 fill the round-of-32 third-place slots. Mirrors the updater's bestThirds().
function bestThirds() {
  const thirds = [];
  for (const grp of computeGroups()) {
    const r = grp.rows[2];
    if (r) thirds.push({ group: grp.name.replace(/^Group\s*/i, ''), team: r.team, pts: r.pts, gd: r.gf - r.ga, gf: r.gf });
  }
  thirds.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.group.localeCompare(b.group));
  return thirds.map((t, i) => ({ rank: i + 1, qualifies: i < 8, ...t }));
}

function renderTeamsBar() {
  const bar = document.getElementById('teams-bar');
  bar.innerHTML = '';

  const countryPanel = document.createElement('div');
  countryPanel.className = 'group-card teams-panel';
  const cTitle = document.createElement('h3');
  cTitle.textContent = L.hostCountry;
  cTitle.title = L.hostCountryTip;
  countryPanel.appendChild(cTitle);
  const countries = [...new Set(allVenues().map(v => v.country))].sort((a, b) => disp(a).localeCompare(disp(b), L.locale));
  for (const country of countries) {
    const chip = document.createElement('span');
    chip.className = 'team-chip venue-chip' + (selectedCountries.has(country) ? ' sel' : '');
    chip.textContent = disp(country);
    chip.addEventListener('click', () => {
      if (selectedCountries.has(country)) selectedCountries.delete(country);
      else selectedCountries.add(country);
      renderAll();
    });
    countryPanel.appendChild(chip);
  }
  bar.appendChild(countryPanel);

  const venuePanel = document.createElement('div');
  venuePanel.className = 'group-card teams-panel';
  const vTitle = document.createElement('h3');
  vTitle.textContent = L.venuesHeading;
  vTitle.title = L.venuesTip;
  venuePanel.appendChild(vTitle);
  for (const venue of allVenues()) {
    const chip = document.createElement('span');
    chip.className = 'team-chip venue-chip' + (selectedVenues.has(venue.location) ? ' sel' : '');
    chip.textContent = venue.city;
    chip.title = venue.stadium;
    chip.addEventListener('click', () => {
      if (selectedVenues.has(venue.location)) selectedVenues.delete(venue.location);
      else selectedVenues.add(venue.location);
      renderAll();
    });
    venuePanel.appendChild(chip);
  }
  bar.appendChild(venuePanel);

  const panel = document.createElement('div');
  panel.className = 'group-card teams-panel';
  const title = document.createElement('h3');
  title.textContent = L.teamsHeading;
  title.title = L.teamsTip;
  panel.appendChild(title);

  const toggle = document.createElement('span');
  toggle.className = 'team-chip filter-toggle' + (filterOnly ? ' on' : '');
  toggle.textContent = (filterOnly ? '✓ ' : '') + L.onlySelected;
  toggle.title = L.onlySelectedTip;
  toggle.addEventListener('click', () => { filterOnly = !filterOnly; renderAll(); });
  panel.appendChild(toggle);
  const allTeams = [...new Set(MATCHES.filter(m => m.matchNumber <= 72).flatMap(m => [m.homeTeam, m.awayTeam]))]
    .sort((a, b) => disp(a).localeCompare(disp(b), L.locale));
  for (const team of allTeams) {
    const chip = document.createElement('span');
    chip.className = 'team-chip' + (isSel(team) ? ' sel' : '');
    chip.textContent = disp(team);
    if (isSel(team)) {
      chip.style.color = colorOf(team);
      chip.style.borderColor = colorOf(team);
    }
    chip.addEventListener('click', () => {
      toggleTeam(team);
      renderAll();
    });
    panel.appendChild(chip);
  }
  bar.appendChild(panel);
}

function allVenues() {
  const seen = new Map();
  for (const m of MATCHES) {
    if (!seen.has(m.location)) seen.set(m.location, { location: m.location, stadium: m.stadium, city: m.city, country: m.country });
  }
  return [...seen.values()].sort((a, b) => a.city.localeCompare(b.city));
}

function renderVenues() {
  const container = document.getElementById('venues');
  container.innerHTML = '';
  const fmtDate = new Intl.DateTimeFormat(L.locale, { weekday: 'short', day: 'numeric', month: 'short', timeZone: tz });

  for (const venue of allVenues()) {
    const visibleMatches = MATCHES.filter(m => m.location === venue.location && matchVisible(m));
    if (!visibleMatches.length) continue;

    const matchRows = visibleMatches.map(m => {
      const played = m.homeScore !== null && m.awayScore !== null;
      const home = prettyTeam(m.homeTeam), away = prettyTeam(m.awayTeam);
      const knockout = stageOf(m.matchNumber);
      return `<div class="gm${isSel(m.homeTeam) || isSel(m.awayTeam) ? ' sel' : ''}">
        <span class="gm-date">${fmtDate.format(new Date(m.dateUtc))} ${partsFor(m.dateUtc).time}</span>
        <span class="gm-teams${home.ph || away.ph ? ' placeholder' : ''}">${home.ph ? home.text : teamSpan(m.homeTeam)} – ${away.ph ? away.text : teamSpan(m.awayTeam)}</span>
        <span class="gm-res${played ? '' : ' vs'}">${played ? m.homeScore + '–' + m.awayScore : 'vs'}</span>
        <span class="gm-bc">${bcBadge(m)}</span>
        <span class="gm-loc">${knockout ? `<span class="stage-tag">${knockout}</span>` : dispGroup(m.group)}</span>
      </div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'group-card';
    card.innerHTML = `<h3>${venue.stadium}</h3>
      <div class="venue-city">${venue.city}, ${disp(venue.country)}</div>
      <div class="gm-list">${matchRows}</div>`;
    container.appendChild(card);
  }
}

function renderGroups() {
  const container = document.getElementById('groups');
  container.innerHTML = '';
  const fmtDate = new Intl.DateTimeFormat(L.locale, { weekday: 'short', day: 'numeric', month: 'short', timeZone: tz });

  for (const group of computeGroups()) {
    const card = document.createElement('div');
    card.className = 'group-card';
    card.dataset.group = group.name;
    const rows = group.rows.map(r => {
      const gd = r.gf - r.ga;
      return `<tr${isSel(r.team) ? ' class="sel"' : ''}>
        <td class="t" title="${disp(r.team)}">${teamSpan(r.team)}</td>
        <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
        <td>${gd > 0 ? '+' + gd : gd}</td><td class="pts">${r.pts}</td>
      </tr>`;
    }).join('');

    const visibleMatches = MATCHES.filter(m => m.group === group.name && matchVisible(m));
    if (!visibleMatches.length) continue;
    const matchRows = visibleMatches.map(m => {
      const played = m.homeScore !== null && m.awayScore !== null;
      return `<div class="gm${isSel(m.homeTeam) || isSel(m.awayTeam) ? ' sel' : ''}">
        <span class="gm-date">${fmtDate.format(new Date(m.dateUtc))} ${partsFor(m.dateUtc).time}</span>
        <span class="gm-teams">${teamSpan(m.homeTeam)} – ${teamSpan(m.awayTeam)}</span>
        <span class="gm-res${played ? '' : ' vs'}">${played ? m.homeScore + '–' + m.awayScore : 'vs'}</span>
        <span class="gm-bc">${bcBadge(m)}</span>
        <span class="gm-loc">${m.stadium}, ${m.city}, ${disp(m.country)}</span>
      </div>`;
    }).join('');

    card.innerHTML = `<h3>${dispGroup(group.name)}</h3>
      <table>
        <colgroup><col style="width:43%"><col><col><col><col><col style="width:13%"><col></colgroup>
        <thead><tr><th class="t">${L.thTeam}</th>${L.th.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="gm-list">${matchRows}</div>`;
    container.appendChild(card);
  }
}

const bjComboIndex = combo => BJ_COMBOS.indexOf(combo) + 1; // 1..495, or 0 if not a settled 8-group combo

// A slot string that is a placeholder, not a real team (1A / 2C / 3ABCDF / W74 / RU101 / L101 / TBA)
const bjPlaceholder = s => !s || /^[123][A-L]+$/.test(s) || /^(W|L|RU)\d+$/.test(s) || s === 'To be announced';

function renderBracket() {
  const el = document.getElementById('bracket');
  if (!BRACKET || !Array.isArray(BRACKET.bracket)) {
    el.innerHTML = `<p class="bj-empty">${L.bracketEmpty}</p>`;
    return;
  }
  const byBracket = new Map(BRACKET.bracket.map(b => [b.matchNumber, b]));
  const byMatch = new Map(MATCHES.map(m => [m.matchNumber, m]));
  const dateFmt = new Intl.DateTimeFormat(L.locale, { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: tz });

  // Groups whose every match has been played → final positions are settled.
  const completed = new Set(); const groupIds = new Set();
  { const byG = new Map();
    for (const mm of MATCHES) {
      if (!mm.group) continue;
      const g = mm.group.replace(/^Group\s*/i, '');
      groupIds.add(g);
      (byG.get(g) ?? byG.set(g, []).get(g)).push(mm);
    }
    for (const [g, ms] of byG) if (ms.every(x => x.homeScore !== null && x.awayScore !== null)) completed.add(g);
  }
  const allGroupsDone = groupIds.size > 0 && completed.size === groupIds.size;

  // A slot is "decided" (not just the current projection) once its group is finished
  // (1st/2nd), once every group is finished so the third-place allocation is fixed (3rd),
  // once the feed has officially placed the team, or once the match has been played.
  const isDecided = (resolved, played) => {
    if (played) return true;
    if (!resolved || !resolved.team) return false;
    if (resolved.resolved) return true;
    if (resolved.position === 1 || resolved.position === 2) return completed.has(resolved.group);
    if (resolved.position === 3) return allGroupsDone;
    return false;
  };

  // team -> seeding code (1E / 2C / 3A), from the current group standings — used to label
  // feed-resolved slots that carry no position/group of their own (e.g. the host nations).
  const seedOf = new Map();
  for (const grp of computeGroups()) {
    const letter = grp.name.replace(/^Group\s*/i, '');
    grp.rows.forEach((r, i) => { if (i < 3) seedOf.set(r.team, (i + 1) + letter); });
  }
  // Round-of-32 seeding code for one side: the slot's own position+group, else the team's
  // current standing. (1st/2nd/3rd of a group, e.g. winner of E -> 1E, third of A -> 3A.)
  const seedCode = (resolved, team) => {
    if (resolved && [1, 2, 3].includes(resolved.position) && resolved.group) return resolved.position + resolved.group;
    if (team && seedOf.has(team)) return seedOf.get(team);
    return '';
  };

  // Resolve one side of a tie to { html, real, ph } — a real team gets its flag + code,
  // an unresolved slot gets the compact placeholder code (1A, 3ABCDF, W74, RU101).
  const side = (resolved, playedName, played, expand) => {
    const team = (played && playedName) || (resolved && resolved.team) || null;
    if (team && !bjPlaceholder(team)) {
      const code = TEAM_CODE[team] || disp(team);
      const flag = TEAM_CODE[team] ? `<img class="bj-flag" src="img/flags/${TEAM_CODE[team].toLowerCase()}.svg" alt="" loading="lazy">` : '<span class="bj-flag"></span>';
      return { flag, html: code, real: team, ph: false, title: disp(team) };
    }
    let code = L.tbd;
    if (resolved) {
      if (resolved.slot && !/to be announced/i.test(resolved.slot)) code = resolved.slot;
      else if (resolved.sourceType === 'winner') {
        // Round of 16: until the round-of-32 leg is played, show the two countries in it
        // (only when expanded — i.e. the mobile list; the desktop tree keeps the Wxx code)
        const leg = byBracket.get(resolved.sourceMatch);
        const lm = byMatch.get(resolved.sourceMatch);
        const legPlayed = lm && lm.homeScore !== null && lm.awayScore !== null;
        const t1 = leg && leg.home && leg.home.team, t2 = leg && leg.away && leg.away.team;
        if (expand && resolved.sourceMatch >= 73 && resolved.sourceMatch <= 88 && t1 && t2 && !legPlayed) {
          const mini = t => `${TEAM_CODE[t] ? `<img class="bj-flag-sm" src="img/flags/${TEAM_CODE[t].toLowerCase()}.svg" alt="">` : ''}${TEAM_CODE[t] || disp(t)}`;
          return { flag: '', html: `${mini(t1)}<span class="bj-vs">/</span>${mini(t2)}`, real: null, ph: true, title: `${disp(t1)} / ${disp(t2)}` };
        }
        code = 'W' + resolved.sourceMatch;
      }
      else if (resolved.sourceType === 'loser') code = 'RU' + resolved.sourceMatch;
    }
    return { flag: '<span class="bj-flag"></span>', html: code, real: null, ph: true, title: '' };
  };

  // One match card. numPos places the "Mxx" label: 'l' left, 'r' right, 'b' below.
  // expand=true (mobile list) shows the round-of-32 matchup for undecided round-of-16 slots.
  const card = (n, numPos, expand) => {
    const b = byBracket.get(n), m = byMatch.get(n);
    if (!b && !m) return '';
    const played = m && m.homeScore !== null && m.awayScore !== null;
    const home = side(b && b.home, m && m.homeTeam, played, expand);
    const away = side(b && b.away, m && m.awayTeam, played, expand);
    const dt = (b && b.dateUtc) || (m && m.dateUtc);
    const hWin = played && m.homeScore > m.awayScore;
    const aWin = played && m.awayScore > m.homeScore;
    const stadium = (b && b.stadium) || (m && m.stadium);
    const city = (b && b.city) || (m && m.city);
    const country = (b && b.country) || (m && m.country);
    const cflag = country && TEAM_CODE[country]
      ? `<img class="bj-cflag" src="img/flags/${TEAM_CODE[country].toLowerCase()}.svg" alt="${disp(country)}" title="${disp(country)}">`
      : '';
    const venue = stadium
      ? `<div class="bj-venue">${cflag}<span class="bj-venue-text" title="${stadium}, ${city}, ${disp(country)}"><span>${stadium}</span><span>${city}</span></span></div>`
      : '';
    // Show the group+position seed code in the round of 32 (matches 73–88) for known teams;
    // unresolved slots already render the code as their name, so don't double it up.
    const r32 = n <= 88;
    const hSeed = r32 && !home.ph ? seedCode(b && b.home, home.real) : '';
    const aSeed = r32 && !away.ph ? seedCode(b && b.away, away.real) : '';
    const row = (s, score, win, decided, seed) => `<div class="bj-row${win ? ' bj-win' : ''}${decided ? ' bj-decided' : ''}">${s.flag}` +
      `<span class="bj-name${s.ph ? ' placeholder' : ''}"${s.title ? ` title="${s.title}"` : ''}>${s.html}</span>` +
      (seed ? `<span class="bj-seed-code">${seed}</span>` : '') +
      `<span class="bj-score">${score}</span></div>`;
    return `<div class="bj-card num-${numPos}">
      <div class="bj-when"><span>${dt ? dateFmt.format(new Date(dt)) : ''}</span><span>${dt ? partsFor(dt).time : ''}</span></div>
      <div class="bj-match">
        ${row(home, played ? m.homeScore : '', hWin, isDecided(b && b.home, played), hSeed)}
        ${row(away, played ? m.awayScore : '', aWin, isDecided(b && b.away, played), aSeed)}
      </div>
      ${venue}
      <span class="bj-num">M${n}</span>
    </div>`;
  };

  const column = (nums, head, numPos) => `<div class="bj-col">
    <div class="bj-col-head">${head}</div>
    <div class="bj-seeds">${nums.map(n => `<div class="bj-seed">${card(n, numPos)}</div>`).join('')}</div>
  </div>`;

  const leftHeads = [L.stages[0], L.stages[1], L.stages[2]];
  const rightHeads = [L.stages[2], L.stages[1], L.stages[0]];
  const leftCols = BJ_LEFT.map((nums, i) => column(nums, leftHeads[i], 'l')).join('');
  const rightCols = BJ_RIGHT.map((nums, i) => column(nums, rightHeads[i], 'r')).join('');

  const centre = `<div class="bj-center">
    <div class="bj-final">
      <div class="bj-round-head">${L.stages[5]}</div>
      ${card(104, 'b')}
    </div>
    <div class="bj-sf-row">
      <div class="bj-sf bj-sf-l"><div class="bj-round-head">${L.stages[3]}</div>${card(101, 'l')}</div>
      <div class="bj-sf bj-sf-r"><div class="bj-round-head">${L.stages[3]}</div>${card(102, 'r')}</div>
    </div>
    <div class="bj-third">
      <div class="bj-round-head">${L.stages[4]}</div>
      ${card(103, 'b')}
    </div>
  </div>`;

  // Best third-placed teams — shown above the tree, but only while the group stage is still
  // deciding teams. Once every team is set, the bracket itself shows the thirds, so hide it.
  let thirdsPanel = '';
  if (!allGroupsDone) {
    const thirdItem = t => `<div class="bj-th-item${t.qualifies ? ' q' : ''}">
      <span class="bj-th-rank">${t.rank}</span>
      ${TEAM_CODE[t.team] ? `<img class="bj-cflag" src="img/flags/${TEAM_CODE[t.team].toLowerCase()}.svg" alt="">` : '<span class="bj-cflag"></span>'}
      <span class="bj-th-team">${disp(t.team)}</span>
      <span class="bj-th-grp">${dispGroup('Group ' + t.group)}</span>
      <span class="bj-th-gd">${t.gd > 0 ? '+' + t.gd : t.gd < 0 ? t.gd : '±0'}</span>
      <span class="bj-th-pts">${t.pts}&nbsp;${L.th[5]}</span>
    </div>`;
    const thirds = bestThirds();
    const combo = thirds.filter(t => t.qualifies).map(t => t.group).sort().join('');
    thirdsPanel = `<div class="bj-thirds">
      <h3 class="bj-thirds-title">${L.bestThirds}</h3>
      <div class="bj-thirds-grid">${thirds.map(thirdItem).join('')}</div>
      ${combo.length === 8 ? `<div class="bj-combo">${L.combination(combo.split('').join('·'), bjComboIndex(combo))}</div>` : ''}
    </div>`;
  }

  // Mobile: a round-by-round vertical list (shown instead of the tree on narrow screens,
  // so there is no horizontal scrolling). Reuses the same cards.
  const rounds = [
    [L.stages[0], [73, 74, 75, 76, 77, 78, 79, 80, 81, 82, 83, 84, 85, 86, 87, 88]],
    [L.stages[1], [89, 90, 91, 92, 93, 94, 95, 96]],
    [L.stages[2], [97, 98, 99, 100]],
    [L.stages[3], [101, 102]],
    [L.stages[4], [103]],
    [L.stages[5], [104]],
  ];
  const listHtml = `<div class="bj-list">${rounds.map(([label, nums]) => `<div class="bj-list-round">
    <h3 class="bj-list-head">${label}</h3>
    <div class="bj-list-cards">${nums.map(n => card(n, 'b', true)).join('')}</div>
  </div>`).join('')}</div>`;

  el.innerHTML = thirdsPanel + `<div class="bj-scroll"><div class="bj">
    <div class="bj-side bj-side-l">${leftCols}</div>
    ${centre}
    <div class="bj-side bj-side-r">${rightCols}</div>
  </div></div>` + listHtml;
}

  const groupStage = MATCHES.filter(m => m.matchNumber <= 72);

  document.getElementById('btn-bracket').textContent = teamsDecided ? L.bracketSet : L.bracketLive;

// "Results updated <time>" — from the Last-Modified header of matches.json

  if (!dataUpdatedAt) return;
  const el = document.getElementById('last-updated');
  el.hidden = false;
  const fmt = new Intl.DateTimeFormat(L.locale, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: tz });
  el.textContent = `${L.lastUpdated}: ${fmt.format(dataUpdatedAt)} (${tzAbbr()})`;
}
btnTz.addEventListener('click', () => { tz = tz === 'UTC' ? TZ_LOCAL : 'UTC'; renderAll(); });

// ---- View toggle ----
const VIEWS = ['list', 'calendar', 'groups', 'venues', 'bracket'];
for (const v of VIEWS) {
  document.getElementById('btn-' + v).addEventListener('click', () => showView(v));
}
function showView(view) {
  for (const v of VIEWS) {
    document.getElementById(v).hidden = v !== view;
    document.getElementById('btn-' + v).classList.toggle('active', v === view);
  }
  // The bracket shows the whole tree — no filtering — so hide the filter sidebar for it
  document.body.classList.toggle('bracket-view', view === 'bracket');
}

// Group tags in the list view jump to that group's card in the groups view
list.addEventListener('click', e => {
  const tag = e.target.closest('.group-link');
  if (!tag) return;
  showView('groups');
  document.querySelector(`#groups .group-card[data-group="${tag.dataset.group}"]`)
    ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ---- Language toggle ----
const btnLangEn = document.getElementById('btn-lang-en');
const btnLangSv = document.getElementById('btn-lang-sv');
function setLang(l) {
  lang = l;
  L = I18N[l];
  try { localStorage.setItem('lang', l); } catch {}
  document.documentElement.lang = l;
  btnLangEn.classList.toggle('active', l === 'en');
  btnLangSv.classList.toggle('active', l === 'sv');
  renderAll();
}
btnLangEn.addEventListener('click', () => setLang('en'));
btnLangSv.addEventListener('click', () => setLang('sv'));

setLang(lang);
showView('groups');

// ---- Live data refresh ----
// In the cluster an updater sidecar rewrites matches.json with fresh results;
// pick those up on load and every 5 minutes. Fails silently on file:// or offline,
// where the baked-in data above is all there is.
async function refreshData() {
  // Bracket is projected from the same results, so refresh it on the same cycle.
  fetch('bracket.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data && Array.isArray(data.bracket) && JSON.stringify(data) !== JSON.stringify(BRACKET)) {
        BRACKET = data;
        renderBracket();
      }
    })
    .catch(() => { /* keep current bracket (file:// or offline) */ });

  try {
    const res = await fetch('matches.json', { cache: 'no-store' });
    if (!res.ok) return;
    const lm = new Date(res.headers.get('last-modified'));
    if (!isNaN(lm)) dataUpdatedAt = lm;
    const data = await res.json();
    if (Array.isArray(data) && data.length && JSON.stringify(data) !== JSON.stringify(MATCHES)) {
      MATCHES = data;
      renderAll();
    } else {
      updateStamp();
    }
  } catch { /* keep current data */ }
}
refreshData();
setInterval(refreshData, 5 * 60 * 1000);
</script>
